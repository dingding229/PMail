        action: {enum: [1, 2, 3, 4], description: 1 mark read; 2 forward; 3 move to deleted; 4 move to group.}
        params:
          type: string
          description: 'Action 2: one address, a comma-separated list, or a JSON-encoded string array. Action 4: a group

            route.}
    EmailDetail:
      type: object
      properties:
        spam:
          oneOf:
          - $ref: '#/components/schemas/MailSpamAssessment'
          - type: 'null'
        risk:
          description: Null if the message has not been analyzed.
          oneOf:
          - $ref: '#/components/schemas/MailRiskAssessment'
          - type: 'null'
        verification_code:
          oneOf:
          - $ref: '#/components/schemas/MailVerificationCode'
          - type: 'null'

        id: {type: integer}
        to_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAddress'}
        cc_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAddress'}
        bcc_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAddress'}
        reply_to_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAddress'}
        attachments_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAttachment'}
        send_date_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        create_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        update_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        send_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        cron_send_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        is_draft: {type: boolean}
        dangerous:
          type: boolean
          description: True for evaluated inbound mail with a failing authentication summary; false for drafts and outbound mail.
        auth_results: {$ref: '#/components/schemas/MailAuthResults'}
        auth_status:
          enum: [pass, fail, none, not_applicable]
          description: pass for aligned inbound authentication, fail for an evaluated failure, none for absent or inconclusive evidence, and not_applicable for drafts and outgoing mail. Older messages retain their legacy classification.
        is_read: {type: boolean}
        is_starred: {type: boolean}
        mailbox_status: {type: integer}
        type: {enum: [0, 1]}
        subject: {type: string}
        reply_to:
          type: string

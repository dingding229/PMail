  schemas:
    SiteBackupPassphrase:
      type: string
      format: password
      minLength: 12
      maxLength: 1024
      writeOnly: true
      description: At least 12 Unicode characters and at most 1024 UTF-8 bytes. Not retained after the operation.
    SiteBackupFile:
      type: object
      required: [name, size, created_at, pmail_version]
      properties:
        name: {type: string, example: pmail-1.0.0-20261124T083000.000000000Z.pmailbak}
        size: {type: integer, format: int64, minimum: 0}
        created_at: {type: string, format: date-time}
        pmail_version: {type: string, description: 'Inferred from the canonical filename; the authenticated version is checked on restore.'}
        is_pre_restore: {type: boolean}
    SiteBackupProgress:
      type: object
      properties:
        tables_done: {type: integer, minimum: 0}
        tables_total: {type: integer, minimum: 0}
        rows_done: {type: integer, format: int64, minimum: 0}
    SiteBackupJob:
      allOf:
      - {$ref: '#/components/schemas/SiteBackupProgress'}
      - type: object
        required: [id, kind, state, stage, tables_done, tables_total, rows_done]
        properties:
          id: {type: string, pattern: '^[a-f0-9]{48}$'}
          kind: {type: string, enum: [export, restore]}
          state: {type: string, enum: [running, done, failed]}
          stage: {type: string}
          file_name: {type: string}
          error: {type: string, description: Stable machine error code.}
    SiteRestoreStatus:
      allOf:
      - {$ref: '#/components/schemas/SiteBackupProgress'}
      - type: object
        required: [stage]
        properties:
          stage: {type: string, enum: [idle, verifying, entering_maintenance, pre_backup, restoring_db, restoring_files, clearing_sessions, restarting, failed]}
          error_code: {type: string}
          error: {type: string, description: Localized error.}
    MailArchiveSettings:
      type: object
      additionalProperties: false
      required: [max_upload_bytes]
      properties:
        max_upload_bytes: {type: integer, format: int64, minimum: 1048576, maximum: 536870912, default: 52428800}
    MailArchiveTask:
      type: object
      required: [id, state, expires_at]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        state: {type: string, enum: [running, done, failed]}
        expires_at: {type: string, format: date-time}
        error_code: {type: string}
        error: {type: string}
    MailExportStatus:
      allOf:
      - {$ref: '#/components/schemas/MailArchiveTask'}
      - type: object
        required: [exported_count, total_count]
        properties:
          exported_count: {type: integer, format: int64, minimum: 0}
          total_count: {type: integer, format: int64, minimum: 0, description: Estimated snapshot count.}
          size: {type: integer, format: int64, minimum: 0}
    MailImportStatus:
      allOf:
      - {$ref: '#/components/schemas/MailArchiveTask'}
      - type: object
        required: [total, imported, skipped, failed]
        properties:
          total: {type: integer, format: int64, minimum: 0}
          imported: {type: integer, format: int64, minimum: 0}
          skipped: {type: integer, format: int64, minimum: 0}
          failed: {type: integer, format: int64, minimum: 0}
    SiteBackupFileEnvelope:
      type: object
      required: [errorNo, errorMsg, data]
      properties:
        errorNo: {const: 0}
        errorMsg: {type: string}
        data: {$ref: '#/components/schemas/SiteBackupFile'}
    SiteRestoreStatusEnvelope:
      type: object
      required: [errorNo, errorMsg, data]
      properties:
        errorNo: {const: 0}
        errorMsg: {type: string}
        data: {$ref: '#/components/schemas/SiteRestoreStatus'}
    MailExportEnvelope:
      type: object
      required: [errorNo, errorMsg, data]
      properties:
        errorNo: {const: 0}
        errorMsg: {type: string}
        data: {$ref: '#/components/schemas/MailExportStatus'}
    MailImportEnvelope:
      type: object
      required: [errorNo, errorMsg, data]
      properties:
        errorNo: {const: 0}
        errorMsg: {type: string}
        data: {$ref: '#/components/schemas/MailImportStatus'}
    MailArchiveSettingsEnvelope:
      type: object
      required: [errorNo, errorMsg, data]
      properties:
        errorNo: {const: 0}
        errorMsg: {type: string}
        data: {$ref: '#/components/schemas/MailArchiveSettings'}
    SiteBackupStartEnvelope:
      type: object
      required: [errorNo, errorMsg, data]
      properties:
        errorNo: {const: 0}
        errorMsg: {type: string}
        data:
          type: object
          required: [job_id]
          properties:
            job_id: {type: string, pattern: '^[a-f0-9]{48}$'}
            started: {type: boolean, const: true, description: Present for restore.}
    SiteBackupListEnvelope:
      type: object
      required: [errorNo, errorMsg, data]
      properties:
        errorNo: {const: 0}
        errorMsg: {type: string}
        data:
          type: object
          required: [items, active_job]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/SiteBackupFile'}}
            active_job:
              oneOf:
              - {$ref: '#/components/schemas/SiteBackupJob'}
              - {type: 'null'}
    MailChanges:
      type: object
      required: [cursor, changed, new_count, new_items]
      additionalProperties: false
      properties:
        cursor: {type: string}
        changed: {type: boolean}
        new_count: {type: integer, minimum: 0}
        new_items:
          type: array
          maxItems: 5
          description: Latest new messages by descending ID, with no body or hidden recipient fields.
          items: {$ref: '#/components/schemas/MailChangeItem'}
    MailChangeItem:
      type: object
      required: [id, subject, from_name, from_address, to_address, created, group_id]
      additionalProperties: false
      properties:
        id: {type: integer, minimum: 1}
        subject: {type: string}
        from_name: {type: string}
        from_address: {type: string}
        to_address: {type: string, description: The first address in the message's To header or an empty string.}
        created: {type: integer, format: int64, description: Unix milliseconds.}
        group_id: {type: integer, description: Inbox or the selected custom folder ID.}
    C29AddressStatus:
      type: string
      enum: [active, pending, rejected]
    C29AddressSettings:
      type: object
      required: [address_approval_required]
      additionalProperties: false
      properties:
        address_approval_required: {type: boolean, default: true}
    C29AddressOverview:
      type: object
      required: [pending_address_requests]
      properties:
        pending_address_requests: {type: integer, minimum: 0}
    C29AddressRequest:
      allOf:
      - {$ref: '#/components/schemas/MailboxAddress'}
      - type: object
        required: [domain, address, applicant]
        properties:
          domain: {type: string}
          address: {type: string}
          applicant: {type: string, description: Applicant account name.}
    C29RequestPage:
      type: object
      required: [items, page, page_size, total, pending_address_requests]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/C29AddressRequest'}}
        page: {type: integer, minimum: 1, maximum: 1000000}
        page_size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        pending_address_requests: {type: integer, minimum: 0}
    C29RejectReason:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 200}
    C27ProxyFields:
      type: object
      required: [type, host, port]
      properties:
        type: {type: string, enum: [http, https, socks5]}
        host: {type: string, minLength: 1, maxLength: 253, description: 'IPv4, IPv6 or DNS hostname; not a URL.'}
        port: {type: integer, minimum: 1, maximum: 65535}
        username: {type: string, maxLength: 255}
    C27ProxyInput:
      allOf:
      - {$ref: '#/components/schemas/C27ProxyFields'}
      - type: object
        properties:
          password: {type: string, maxLength: 512, writeOnly: true, description: Omit to keep; empty clears.}
      unevaluatedProperties: false
    C27ProxyView:
      oneOf:
      - allOf:
        - {$ref: '#/components/schemas/C27ProxyFields'}
        - type: object
          required: [password_set]
          properties:
            password_set: {type: boolean}
        unevaluatedProperties: false
      - type: 'null'
    C27Language:
      type: string
      enum: [zh-CN, zh-TW, en, ja, ko, fr, de, es, ru]
    C27Engine:
      type: string
      enum: [ai, web]
    C27PolicyFields:
      type: object
      properties:
        web_enabled: {type: boolean, default: false}
        ai_enabled: {type: boolean, default: false, description: Enables AI translation only, not summary and extraction.}
        default_engine: {$ref: '#/components/schemas/C27Engine', default: web}
        provider: {type: string, enum: [google_web, edge_web, deepl, libretranslate, mymemory], default: google_web, description: 'edge_web retains the existing ID and uses Microsoft (Bing) Web Translation.'}
        url: {type: string, maxLength: 512, description: LibreTranslate server URL, or full /translate endpoint.}
        deepl_tier: {type: string, enum: [auto, free, pro], default: auto, description: Auto selects the free endpoint when the key ends in :fx.}
        mymemory_email:
          type: string
          anyOf: [{format: email}, {const: ''}]
          maxLength: 254
          default: ''
          description: Optional contact email (empty clears). Returned unchanged as a normal administrator setting and sent only to MyMemory in the de parameter to increase its daily quota.
        proxy_mode: {type: string, enum: [none, custom, telegram], default: none}
        max_chars: {type: integer, minimum: 500, maximum: 50000, default: 8000, description: Combined subject and body in Unicode code points.}
        daily_limit_per_user: {type: integer, minimum: 0, default: 200, description: Zero means unlimited.}
        timeout: {type: integer, minimum: 1, maximum: 120, default: 30, description: Seconds for the full upstream operation.}
        ai_user_config_enabled: {type: boolean, default: true}
        ai_allow_private_network: {type: boolean, default: false}
    C27PolicyPatch:
      allOf:
      - {$ref: '#/components/schemas/C27PolicyFields'}
      - type: object
        properties:
          proxy: {$ref: '#/components/schemas/C27ProxyInput'}
          clear_proxy: {type: boolean, default: false}
          api_key: {type: string, maxLength: 1024, writeOnly: true, description: Omit to keep for the same provider/LibreTranslate URL; empty clears.}
      unevaluatedProperties: false
    C27Policy:
      allOf:
      - {$ref: '#/components/schemas/C27PolicyFields'}
      - type: object
        required: [api_key_set, proxy]
        properties:
          api_key_set: {type: boolean}
          proxy: {$ref: '#/components/schemas/C27ProxyView'}
      unevaluatedProperties: false
    C27WebTest:
      type: object
      required: [subject, text, provider, latency_ms]
      properties:
        subject: {type: string}
        text: {type: string}
        provider: {type: string, enum: [google_web, edge_web, deepl, libretranslate, mymemory]}
        latency_ms: {type: integer, minimum: 0}
    C27AITest:
      type: object
      required: [model, latency_ms]
      properties:
        model: {type: string}
        latency_ms: {type: integer, minimum: 0}
    C27Preferences:
      type: object
      additionalProperties: false
      properties:
        target_lang:
          oneOf: [{$ref: '#/components/schemas/C27Language'}, {const: ''}]
          default: ''
        auto_translate: {type: boolean, default: false}
        translate_engine:
          oneOf: [{$ref: '#/components/schemas/C27Engine'}, {const: ''}]
          default: ''
        ai_auto_summary: {type: boolean, default: false}
    C27AIFields:
      type: object
      properties:
        base_url: {type: string, maxLength: 512, description: HTTP(S) OpenAI-compatible base or full chat/completions URL; no userinfo or query/fragment.}
        model: {type: string, maxLength: 200}
        timeout: {type: integer, minimum: 1, maximum: 120, default: 30}
        proxy_mode: {type: string, enum: [none, system, custom], default: none, description: System uses the web translation proxy or falls back to Telegram. Network policy checks the connected endpoint (the proxy when in use).}
    C27AIInput:
      allOf:
      - {$ref: '#/components/schemas/C27AIFields'}
      - type: object
        required: [base_url, model]
        properties:
          api_key: {type: string, maxLength: 1024, writeOnly: true, description: Omit to keep if base_url is unchanged; empty clears.}
          proxy: {$ref: '#/components/schemas/C27ProxyInput'}
          clear_proxy: {type: boolean, default: false}
      unevaluatedProperties: false
    C27AIView:
      allOf:
      - {$ref: '#/components/schemas/C27AIFields'}
      - type: object
        required: [configured, ai_user_config_enabled, ai_allow_private_network, api_key_set, proxy]
        properties:
          configured: {type: boolean}
          ai_user_config_enabled: {type: boolean}
          ai_allow_private_network: {type: boolean}
          api_key_set: {type: boolean}
          proxy: {$ref: '#/components/schemas/C27ProxyView'}
      unevaluatedProperties: false
    C27TranslateInput:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: integer, minimum: 1}
        target_lang: {$ref: '#/components/schemas/C27Language'}
        engine: {$ref: '#/components/schemas/C27Engine'}
        force: {type: boolean, default: false}
    C27Translation:
      type: object
      required: [subject, text, target_lang, provider, engine, cached, truncated]
      properties:
        subject: {type: string, maxLength: 8192}
        text: {type: string, description: Untrusted plain text; never interpret as HTML.}
        source_lang: {type: string, maxLength: 24}
        target_lang: {$ref: '#/components/schemas/C27Language'}
        provider: {type: string, enum: [google_web, edge_web, deepl, libretranslate, mymemory, openai_compatible]}
        engine: {$ref: '#/components/schemas/C27Engine'}
        cached: {type: boolean}
        truncated: {type: boolean}
    C27AIRequest:
      type: object
      additionalProperties: false
      required: [id, action]
      properties:
        id: {type: integer, minimum: 1}
        action: {type: string, enum: [summary, extract]}
        lang: {$ref: '#/components/schemas/C27Language'}
        force: {type: boolean, default: false}
    C27AIResult:
      type: object
      required: [action, lang, model, cached, truncated]
      properties:
        lang: {$ref: '#/components/schemas/C27Language'}
        model: {type: string}
        cached: {type: boolean}
        truncated: {type: boolean}
      oneOf:
      - required: [summary, key_points]
        properties:
          action: {const: summary}
          summary: {type: string, maxLength: 2500, description: Three to five sentences.}
          key_points: {type: array, maxItems: 6, items: {type: string, maxLength: 300}}
      - required: [action_items, dates, amounts, links, codes, contacts]
        properties:
          action: {const: extract}
          action_items:
            type: array
            maxItems: 20
            items:
              type: object
              required: [text]
              properties:
                text: {type: string, maxLength: 500}
                due: {type: string, maxLength: 80}
          dates:
            type: array
            maxItems: 20
            items:
              type: object
              required: [text]
              properties:
                text: {type: string, maxLength: 200}
                iso: {type: string, maxLength: 40}
          amounts:
            type: array
            maxItems: 20
            items:
              type: object
              required: [text]
              properties:
                text: {type: string, maxLength: 200}
                value: {type: number}
                currency: {type: string, maxLength: 12}
          links:
            type: array
            maxItems: 20
            items:
              type: object
              required: [text, url]
              properties:
                text: {type: string, maxLength: 200}
                url: {type: string, format: uri, maxLength: 2048, description: An HTTP(S) URL present in the original text.}
          codes:
            type: array
            maxItems: 20
            items:
              type: object
              required: [type, value]
              properties:
                type: {type: string, enum: [verification, tracking, order, other]}
                value: {type: string, maxLength: 128, description: A literal code from the original text.}
          contacts:
            type: array
            maxItems: 20
            items:
              type: object
              properties:
                name: {type: string, maxLength: 150}
                email: {type: string, maxLength: 254}
                phone: {type: string, maxLength: 80}
    C9AdminTelegram:
      type: object

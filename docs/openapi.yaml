        only_verification:
          type: boolean
        include_spam:
          type: boolean
        include_preview:
          type: boolean
        auto_translate:
          type: boolean
          default: false
          description: Add the translated subject using the user's translation engine (or the administrator default) when available. The translated body is included only when the original preview would be shown; a failed translation still sends the original notification. Omission means false.
        quiet_hours:
          oneOf:
          - $ref: '#/components/schemas/C9QuietHours'
          - type: 'null'
      required:
      - group_ids
      - only_verification
      - include_spam
      - include_preview
      - quiet_hours
      additionalProperties: false
    C9TelegramUser:

        webhook_mode:
          const: polling
      required:
      - configured
      - bot_username
      - proxy_set
      - proxy
      - proxy_source
      - webhook_mode
      additionalProperties: false
    C9AdminTelegramPatch:
      type: object
      properties:
        bot_token:
          type: string
          description: Omit to keep; empty clears. Never echoed.
        proxy:
          oneOf:
          - $ref: '#/components/schemas/C27ProxyInput'
          - type: string
            deprecated: true
            description: Legacy URL accepted for one version only. Empty string or null clears stored fields.
          - type: 'null'
        clear_proxy:
          type: boolean
          description: Clear the stored proxy; may not be combined with non-null proxy fields. Does not change the environment override.
      required: []
      additionalProperties: false
    C9TelegramTest:
      type: object
      properties:
        ok:
          type: boolean
        bot_username:
          type: string
        latency_ms:
          type: integer
          minimum: 0
      required:
      - ok
      - bot_username
      - latency_ms
      additionalProperties: false
    C9QuietHours:
      type: object
      properties:
        start:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
        end:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
        tz:
          type: string
          maxLength: 80
          description: IANA TZ name
      required:
      - start
      - end

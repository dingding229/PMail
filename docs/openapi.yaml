openapi: 3.1.0
info:
  title: PMail Pro HTTP API
  version: 0.0.6
  description: |-
    PMail Pro runtime contract. For timestamps use the additive *_iso fields (RFC3339 with an explicit offset); legacy fields are unchanged. Cookie, scoped Bearer token, and the legacy Token header are alternative credentials. Cookie-authenticated writes require same-origin Origin/Referer; JSON requests with a body require application/json; body limits may produce HTTP 413 before validation; authorization is recorded in x-permission (public, user, admin or owner). Owner routes are scoped to the caller's resource. Administrator access to other users' non-draft mail requires PMAIL_ADMIN_MAIL_ACCESS=1 and is audited.

    JSON responses use {errorNo, errorMsg, data} unless stated otherwise. Legacy failures can return HTTP 200. x-error-codes lists application codes by HTTP status. Don't infer success from HTTP status alone. Unmatched /api requests return HTTP 404 with the localized JSON envelope (errorNo 404). The reusable UnknownApiPath response describes this routing error. Resource-not-found errors on matched routes keep their existing error codes. Unsupported attachment subpaths never return SPA HTML. The legacy setup endpoint is available only on the setup listener; when HTTPS is active the plain HTTP listener serves ping and ACME directly and redirects other requests to HTTPS. Listed GET/POST variants are supported contracts; incidental verbs accepted by some older handlers are not part of the contract.

    POST /api/domain/dns is the DNS guide; GET /api/domain/dns remains a legacy compatibility view. With development CORS enabled, allowlisted origins can send credentialed requests and preflight API/attachment paths. Cookie SameSite behavior is unchanged. Localized errors use the saved user language when set, otherwise X-PMail-Lang, Accept-Language, then PMAIL_DEFAULT_LANG. During pending first registration, only bootstrap, register, ping and ACME are available; other matched API and attachment routes respond HTTP 403.
servers:
- {url: /}
security:
- {Session: []}
- {BearerToken: []}
- {LegacyToken: []}
x-application-error-codes:
  '100': Invalid parameters or credentials (or resource rejected by some legacy handlers).
  '402': Legacy setup required; API is not initialized.
  '403': Login required or session revoked.
  '404': No API route matched the request.
  '405': Insufficient permission.
  '500': Server or delivery failure.
x-unmatched-api-response: {$ref: '#/components/responses/UnknownApiPath'}
paths:
  /api/ping:
    get:
      operationId: pingGet
      tags: [Bootstrap]
      summary: Check HTTP liveness
      x-permission: public
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PongLiteralSuccess'}
    post:
      operationId: pingPost
      tags: [Bootstrap]
      summary: Check HTTP liveness
      x-permission: public
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PongLiteralSuccess'}
  /api/bootstrap:
    get:
      operationId: bootstrap
      tags: [Bootstrap]
      summary: Discover UI initialization state
      x-permission: public
      description: No login is required. The configured primary mail domain is public; a valid cookie or API token
        is required to see the full domain list. The first-run listener also returns need_domain while waiting
        for POST /api/setup/domain.
      security:
      - {}
      - {Session: []}
      - {BearerToken: []}
      - {LegacyToken: []}
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      x-error-codes: {'200': [500], '500': [500]}
      responses:
        '200':
          description: Unwrapped JSON object on success; a legacy JSON error envelope may still be returned.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/Bootstrap'}
                - {$ref: '#/components/schemas/Error500'}
          headers:
            Cache-Control:
              schema: {const: no-store}
        '500': {$ref: '#/components/responses/InternalError'}
    head:
      tags: [Bootstrap]
      x-permission: public
      description: No login is required. Returns headers for GET /api/bootstrap without a response body.
      security:
      - {}
      - {Session: []}
      - {BearerToken: []}
      - {LegacyToken: []}
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      x-error-codes: {'200': [500], '500': [500]}
      operationId: bootstrapHead
      summary: Discover UI initialization state (headers only)
      responses:
        '200':
          description: Success (no body).
          headers:
            Cache-Control:
              schema: {const: no-store}
        '500': {description: Error (no body).}
  /api/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Verify the login password and sign in or request a second factor
      x-permission: public
      security: []
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      x-error-codes: {'200': [100, 402, 500], '400': [100], '403': [405], '405': [100], '429': [100], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/LoginUserSuccess'}
                - {$ref: '#/components/schemas/LoginChallengeSuccess'}
                - {$ref: '#/components/schemas/Error100402500'}
          headers:
            Set-Cookie:
              description: Set or renewed on completed sign-in only; not issued for a second-factor challenge.
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '415': {$ref: '#/components/responses/JSONMediaTypeRequired'}
  /api/login/2fa:
    post:
      operationId: loginSecondFactor
      tags: [Auth]
      summary: Complete a challenged login and set the browser session
      description: The challenge is bound to the source IP, expires after five minutes, and is consumed once. Invalid codes count against the login rate limit.
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - {$ref: '#/components/schemas/SecondFactorCode'}
              - type: object
                required: [challenge]
                properties:
                  challenge: {type: string}
      responses:
        '200':
          description: Login completed; Set-Cookie establishes the authenticated session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginUserSuccess'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/JSONMediaTypeRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/2fa:
    get:
      operationId: secondFactorStatus
      tags: [Auth]
      summary: Check the current browser user’s two-step verification status
      x-permission: user
      security: [{Session: []}]
      responses:
        '200':
          description: Success. Legacy authentication/setup failures may also return HTTP 200 with a nonzero errorNo.
          headers:
            Cache-Control:
              schema: {const: "private, no-store"}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    errorNo: {const: 0}
                    errorMsg: {const: ''}
                    data: {$ref: '#/components/schemas/SecondFactorStatus'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/2fa/setup:
    post:
      operationId: setupSecondFactor
      tags: [Auth]
      summary: Issue a pending authenticator setup key
      x-permission: user
      security: [{Session: []}]
      description: The setup key expires after ten minutes and does not enable two-step verification by itself.
      responses:
        '200':
          description: Success. Legacy authentication/setup failures may also return HTTP 200 with a nonzero errorNo.
          headers:
            Cache-Control:
              schema: {const: "private, no-store"}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    errorNo: {const: 0}
                    errorMsg: {const: ''}
                    data: {$ref: '#/components/schemas/SecondFactorSetup'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/JSONMediaTypeRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/2fa/enable:
    post:
      operationId: enableSecondFactor
      tags: [Auth]
      summary: Verify an authenticator code and enable two-step verification
      x-permission: user
      security: [{Session: []}]
      description: Returns ten recovery codes once and rotates the current browser session.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [code], properties: {code: {type: string, pattern: "^[0-9]{6}$"}}}
      responses:
        '200':
          description: Success. Legacy authentication/setup failures may also return HTTP 200 with a nonzero errorNo.
          headers:
            Cache-Control:
              schema: {const: "private, no-store"}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    errorNo: {const: 0}
                    errorMsg: {const: ''}
                    data: {$ref: '#/components/schemas/RecoveryCodes'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/JSONMediaTypeRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/2fa/disable:
    post:
      operationId: disableSecondFactor
      tags: [Auth]
      summary: Disable two-step verification and delete its credentials
      x-permission: user
      security: [{Session: []}]
      description: Current password and an unused authenticator or recovery code are required.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmSecondFactor'}
      responses:
        '200':
          description: Success. Legacy authentication/setup failures may also return HTTP 200 with a nonzero errorNo.
          headers:
            Cache-Control:
              schema: {const: "private, no-store"}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    errorNo: {const: 0}
                    errorMsg: {const: ''}
                    data: {$ref: '#/components/schemas/SecondFactorStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/JSONMediaTypeRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/2fa/recovery_codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [Auth]
      summary: Replace and return all recovery codes
      x-permission: user
      security: [{Session: []}]
      description: Current password and an unused authenticator or recovery code are required.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmSecondFactor'}
      responses:
        '200':
          description: Success. Legacy authentication/setup failures may also return HTTP 200 with a nonzero errorNo.
          headers:
            Cache-Control:
              schema: {const: "private, no-store"}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    errorNo: {const: 0}
                    errorMsg: {const: ''}
                    data: {$ref: '#/components/schemas/RecoveryCodes'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/JSONMediaTypeRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/app_passwords:
    get:
      operationId: listAppPasswords
      tags: [Auth]
      summary: List app-password metadata
      x-permission: user
      security: [{Session: []}]
      responses:
        '200':
          description: Success. Legacy authentication/setup failures may also return HTTP 200 with a nonzero errorNo.
          headers:
            Cache-Control:
              schema: {const: "private, no-store"}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    errorNo: {const: 0}
                    errorMsg: {const: ''}
                    data: {type: array, items: {$ref: '#/components/schemas/AppPassword'}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createAppPassword
      tags: [Auth]
      summary: Create a named app password and return its secret once
      x-permission: user
      security: [{Session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 80}}}
      responses:
        '200':
          description: Success. Legacy authentication/setup failures may also return HTTP 200 with a nonzero errorNo.
          headers:
            Cache-Control:
              schema: {const: "private, no-store"}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    errorNo: {const: 0}
                    errorMsg: {const: ''}
                    data: {$ref: '#/components/schemas/CreatedAppPassword'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/JSONMediaTypeRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/app_passwords/{id}:
    delete:
      operationId: deleteAppPassword
      tags: [Auth]
      summary: Revoke an owned app password
      x-permission: user
      security: [{Session: []}]
      parameters:
      - {in: path, name: id, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Success. Legacy authentication/setup failures may also return HTTP 200 with a nonzero errorNo.
          headers:
            Cache-Control:
              schema: {const: "private, no-store"}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Envelope'}
                - type: object
                  properties:
                    errorNo: {const: 0}
                    errorMsg: {const: ''}
                    data: {type: 'null'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Destroy the browser session (POST only; requires same-origin Cookie request)
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      x-error-codes: {'200': [402, 403, 500], '403': [405], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/StringValueSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
          headers:
            Set-Cookie:
              description: Session cookie set/renewed, or cleared on logout/password change.
              schema: {type: string}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
        '415': {$ref: '#/components/responses/JSONMediaTypeRequired'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /api/setup:
    post:
      operationId: legacySetup
      tags: [Bootstrap]
      summary: Read or write an opt-in local configuration step
      x-permission: setup-token
      description: Loopback-only listener, disabled unless PMAIL_LEGACY_SETUP=1. The separate setup token is kept in a local file, consumed when setup finishes. Database credentials are never returned.
      security: [{SetupToken: []}]
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetupRequest'}
      x-error-codes: {'200': [100, 402, 500], '400': [100], '403': [405], '405': [100]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/SetupResultSuccess'}
                - {$ref: '#/components/schemas/Error100402500'}
        '404':
          description: No such route or challenge token.
          content:
            text/plain:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '415': {$ref: '#/components/responses/JSONMediaTypeRequired'}
  /api/setup/domain:
    post:
      operationId: setupMailDomain
      tags: [Bootstrap]
      summary: Persist the primary mail domain on the first-run listener
      x-permission: public
      description: Available only before a primary mail domain is set. Requires the local registration key, which remains
        valid for first-admin registration. Browser origins must be same-origin. Successful submissions return before
        the listener handoff; poll GET /api/bootstrap until the normal server is ready.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_key, domain]
              properties:
                registration_key: {type: string}
                domain: {type: string, examples: [example.com]}
      x-error-codes: {'400': [100], '403': [405], '409': [100], '415': [100], '429': [429], '500': [500]}
      responses:
        '200':
          description: Domain saved. The registration key was not consumed.
          content:
            application/json:
              schema:
                type: object
                required: [errorNo, errorMsg, data]
                properties:
                  errorNo: {const: 0}
                  errorMsg: {const: ''}
                  data: {const: ''}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: A concurrent request has already saved the domain.
        '415': {$ref: '#/components/responses/JSONMediaTypeRequired'}
        '429':
          description: Too many setup or registration attempts.
          headers:
            Retry-After:
              schema: {type: integer}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Create the first administrator with a one-time key
      x-permission: public
      description: Available only while pending first registration. A wrong key or already initialized server returns
        HTTP 403. Bad account, password or JSON returns HTTP 400. Five failed attempts per peer IP in ten minutes trigger
        HTTP 429 with Retry-After. A successful registration consumes the key and establishes the same browser session
        as login.
      security: []
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      x-error-codes: {'400': [100], '403': [405], '429': [100], '500': [500]}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUserSuccess'}
          headers:
            Set-Cookie:
              description: Session cookie set/renewed, or cleared on logout/password change.
              schema: {type: string}
            Cache-Control:
              schema: {const: no-store}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          description: Authentication or registration rate limit reached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error100EmptyData'}
          headers:
            Retry-After:
              schema: {type: integer}
              description: Seconds before retrying.
        '500': {$ref: '#/components/responses/InternalError'}
        '415': {$ref: '#/components/responses/JSONMediaTypeRequired'}
  /api/group:
    get:
      operationId: groupTreeGet
      tags: [Groups]
      summary: Get nested groups and built-in mailbox navigation tags
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      x-error-codes: {'200': [402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/GroupNodeListSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: groupTreePost
      tags: [Groups]
      summary: Get nested groups and built-in mailbox navigation tags
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      x-error-codes: {'200': [402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/GroupNodeListSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/group/list:
    get:
      operationId: groupListGet
      tags: [Groups]
      summary: Get the flat group picker list
      x-permission: user
      description: Includes inbox, junk and deleted defaults plus custom groups.
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      x-error-codes: {'200': [402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/GroupListSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: groupListPost
      tags: [Groups]
      summary: Get the flat group picker list
      x-permission: user
      description: Includes inbox, junk and deleted defaults plus custom groups.
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      x-error-codes: {'200': [402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/GroupListSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/group/add:
    post:
      operationId: createGroup
      tags: [Groups]
      summary: Create a mailbox group
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateGroupRequest'}
      x-error-codes: {'200': [100, 402, 403, 500], '400': [100], '403': [405], '405': [100], '409': [100]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/IntegerValueSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/group/del:
    post:
      operationId: deleteGroup
      tags: [Groups]
      summary: Delete a group owned by the caller
      x-permission: owner
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:

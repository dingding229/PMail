openapi: 3.1.0
info:
  title: PMail Pro HTTP API
  version: 4.0.0-beta.1
  description: |-
    v4 runtime contract. For timestamps use the additive *_iso fields (RFC3339 with an explicit offset); legacy fields are unchanged. Cookie, Bearer token, and the legacy Token header are alternative credentials; authorization is recorded in x-permission (public, user, admin or owner). Owner routes are scoped to the caller's resource; any admin override is stated per operation.

    JSON responses use {errorNo, errorMsg, data} unless stated otherwise. Legacy failures can return HTTP 200. x-error-codes lists application codes by HTTP status. Don't infer success from HTTP status alone. Unmatched /api requests return HTTP 404 with the localized JSON envelope (errorNo 404). The reusable UnknownApiPath response describes this routing error. Resource-not-found errors on matched routes keep their existing error codes. Unsupported attachment subpaths never return SPA HTML. The legacy setup endpoint is available only on the setup listener; when HTTPS is active the plain HTTP listener serves ping and ACME directly and redirects other requests to HTTPS. Listed GET/POST variants are supported contracts; incidental verbs accepted by some older handlers are not part of the contract.

    POST /api/domain/dns is the DNS guide; GET /api/domain/dns remains a legacy compatibility view. With development CORS enabled, allowlisted origins can send credentialed requests and preflight API/attachment paths. Cookie SameSite behavior is unchanged. Localized errors use the saved user language when set, otherwise X-PMail-Lang, Accept-Language, then PMAIL_DEFAULT_LANG. During pending first registration, only bootstrap, register, ping and ACME are available; other matched API and attachment routes respond HTTP 403.
servers:
- {url: /}
security:
- {Session: []}
- {BearerToken: []}
- {LegacyToken: []}
x-application-error-codes:
  '100': Invalid parameters or credentials (or resource rejected by some legacy handlers).
  '402': Legacy setup required; API is not initialized.
  '403': Login required or session revoked.
  '404': No API route matched the request.
  '405': Insufficient permission.
  '500': Server or delivery failure.
x-unmatched-api-response: {$ref: '#/components/responses/UnknownApiPath'}
paths:
  /api/ping:
    get:
      operationId: pingGet
      tags: [Bootstrap]
      summary: Check HTTP liveness
      x-permission: public
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PongLiteralSuccess'}
    post:
      operationId: pingPost
      tags: [Bootstrap]
      summary: Check HTTP liveness
      x-permission: public
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PongLiteralSuccess'}
  /api/bootstrap:
    get:
      operationId: bootstrap
      tags: [Bootstrap]
      summary: Discover UI initialization state
      x-permission: public
      description: No login is required. A valid cookie or API token supplies the login state and domain names. Uses the
        same pending state as POST /api/register.
      security:
      - {}
      - {Session: []}
      - {BearerToken: []}
      - {LegacyToken: []}
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      x-error-codes: {'200': [500], '500': [500]}
      responses:
        '200':
          description: Unwrapped JSON object on success; a legacy JSON error envelope may still be returned.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/Bootstrap'}
                - {$ref: '#/components/schemas/Error500'}
          headers:
            Cache-Control:
              schema: {const: no-store}
        '500': {$ref: '#/components/responses/InternalError'}
    head:
      tags: [Bootstrap]
      x-permission: public
      description: No login is required. A valid cookie or API token supplies the login state and domain names. Uses the
        same pending state as POST /api/register.
      security:
      - {}
      - {Session: []}
      - {BearerToken: []}
      - {LegacyToken: []}
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      x-error-codes: {'200': [500], '500': [500]}
      operationId: bootstrapHead
      summary: Discover UI initialization state (headers only)
      responses:
        '200':
          description: Unwrapped JSON object on success; a legacy JSON error envelope may still be returned.
          headers:
            Cache-Control:
              schema: {const: no-store}
        '500': {description: Error (no body).}
  /api/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Authenticate and set the browser session
      x-permission: public
      security: []
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      x-error-codes: {'200': [100, 402, 500], '400': [100], '403': [405], '405': [100], '429': [100], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/LoginUserSuccess'}
                - {$ref: '#/components/schemas/Error100402500'}
          headers:
            Set-Cookie:
              description: Session cookie set/renewed, or cleared on logout/password change.
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Destroy the browser session
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      x-error-codes: {'200': [402, 403, 500], '403': [405], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/StringValueSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
          headers:
            Set-Cookie:
              description: Session cookie set/renewed, or cleared on logout/password change.
              schema: {type: string}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/setup:
    post:
      operationId: legacySetup
      tags: [Bootstrap]
      summary: Read or write a legacy setup step
      x-permission: public
      description: 'Available only on the legacy configuration listener. Legacy password/set and account/set always return
        403: first administrator creation belongs to /api/register.'
      security: []
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetupRequest'}
      x-error-codes: {'200': [100, 402, 500], '400': [100], '403': [405], '405': [100]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/SetupResultSuccess'}
                - {$ref: '#/components/schemas/Error100402500'}
        '404':
          description: No such route or challenge token.
          content:
            text/plain:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /api/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Create the first administrator with a one-time key
      x-permission: public
      description: Available only while pending first registration. A wrong key or already initialized server returns
        HTTP 403. Bad account, password or JSON returns HTTP 400. Five failed attempts per peer IP in ten minutes trigger
        HTTP 429 with Retry-After. A successful registration consumes the key and establishes the same browser session
        as login.
      security: []
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      x-error-codes: {'400': [100], '403': [405], '429': [100], '500': [500]}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUserSuccess'}
          headers:
            Set-Cookie:
              description: Session cookie set/renewed, or cleared on logout/password change.
              schema: {type: string}
            Cache-Control:
              schema: {const: no-store}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          description: Authentication or registration rate limit reached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error100EmptyData'}
          headers:
            Retry-After:
              schema: {type: integer}
              description: Seconds before retrying.
        '500': {$ref: '#/components/responses/InternalError'}
  /api/group:
    get:
      operationId: groupTreeGet
      tags: [Groups]
      summary: Get nested groups and built-in mailbox navigation tags
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      x-error-codes: {'200': [402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/GroupNodeListSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: groupTreePost
      tags: [Groups]
      summary: Get nested groups and built-in mailbox navigation tags
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      x-error-codes: {'200': [402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/GroupNodeListSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/group/list:
    get:
      operationId: groupListGet
      tags: [Groups]
      summary: Get the flat group picker list
      x-permission: user
      description: Includes inbox, junk and deleted defaults plus custom groups.
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      x-error-codes: {'200': [402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/GroupListSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: groupListPost
      tags: [Groups]
      summary: Get the flat group picker list
      x-permission: user
      description: Includes inbox, junk and deleted defaults plus custom groups.
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      x-error-codes: {'200': [402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/GroupListSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/group/add:
    post:
      operationId: createGroup
      tags: [Groups]
      summary: Create a mailbox group
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateGroupRequest'}
      x-error-codes: {'200': [100, 402, 403, 500], '400': [100], '403': [405], '405': [100], '409': [100]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/IntegerValueSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/group/del:
    post:
      operationId: deleteGroup
      tags: [Groups]
      summary: Delete a group owned by the caller
      x-permission: owner
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdRequest'}
      x-error-codes: {'200': [100, 402, 403, 500], '400': [100], '403': [405], '405': [100]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/BooleanValueSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /api/email/list:
    post:
      operationId: listMail
      tags: [Mail]
      summary: List or search messages
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MailListRequest'}
      x-error-codes: {'200': [100, 402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/MailPageSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/email/detail:
    post:
      operationId: mailDetail
      tags: [Mail]
      summary: Read a message and mark it read
      x-permission: owner
      description: Mailbox members or admins; only mailbox members can read draft content. Inaccessible messages still
        return HTTP 200 with errorNo 500. The read marker is in the response.
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdRequest'}
      x-error-codes: {'200': [100, 402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/EmailDetailSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/email/del:
    post:
      operationId: deleteMail
      tags: [Mail]
      summary: Delete messages from the current mailbox
      x-permission: owner
      description: Without forcedDel, moves mail to Deleted; forcedDel removes its mailbox links.
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeleteMessagesRequest'}
      x-error-codes: {'200': [100, 402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/StringValueSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/email/read:
    post:
      operationId: readMail
      tags: [Mail]
      summary: Set the read marker in the current mailbox
      x-permission: owner
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MarkReadRequest'}
      x-error-codes: {'200': [100, 402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/StringValueSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/email/star:
    post:
      operationId: starMail
      tags: [Mail]
      summary: Set or clear stars in the current mailbox
      x-permission: owner
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StarRequest'}
      x-error-codes: {'200': [100, 402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/StringValueSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/email/draft/save:
    post:
      operationId: saveDraft
      tags: [Mail]
      summary: Create or overwrite an owned server draft
      x-permission: owner
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftSaveRequest'}
      x-error-codes: {'200': [100, 402, 403, 500], '403': [405], '404': [100], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/DraftSavedSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/email/draft/delete:
    post:
      operationId: deleteDraft
      tags: [Mail]
      summary: Remove draft links from the current mailbox
      x-permission: owner
      description: Idempotent for absent or inaccessible links. Other mailbox links are not removed.
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftDeleteRequest'}
      x-error-codes: {'200': [100, 402, 403, 500], '403': [405], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/StringValueSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/email/move:
    post:
      operationId: moveMail
      tags: [Mail]
      summary: Move messages to a built-in or custom mailbox group
      x-permission: owner
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MoveMessagesRequest'}
      x-error-codes: {'200': [100, 402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/StringValueSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/email/send:
    post:
      operationId: sendMail
      tags: [Mail]
      summary: Send a message and report per-recipient delivery
      x-permission: user
      description: Select an authorized sending address (or omit it for the primary address). A complete delivery failure
        returns errorNo 500 with the delivery result when it is available.
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendMailRequest'}
      x-error-codes: {'200': [100, 402, 403, 500], '403': [405], '404': [100], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/DeliveryResultSuccess'}
                - {$ref: '#/components/schemas/Error100402403500DeliveryData'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/email/forward:
    post:
      operationId: forwardMail
      tags: [Mail]
      summary: Forward a message with optional original attachments
      x-permission: owner
      description: Mailbox members or admins only. A complete delivery failure returns errorNo 500 with the per-recipient
        result when available.
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForwardMailRequest'}
      x-error-codes: {'200': [100, 402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/DeliveryResultSuccess'}
                - {$ref: '#/components/schemas/Error100402403500DeliveryData'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/forward/get:
    get:
      operationId: getForwardSettingsGet
      tags: [Forwarding]
      summary: Read the current account’s forwarding settings
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      x-error-codes: {'200': [402, 403, 500], '403': [405], '405': [100], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/ForwardSettingsViewSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: getForwardSettingsPost
      tags: [Forwarding]
      summary: Read the current account’s forwarding settings
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      x-error-codes: {'200': [402, 403, 500], '403': [405], '405': [100], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/ForwardSettingsViewSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/forward/set:
    post:
      operationId: setForwardSettings
      tags: [Forwarding]
      summary: Set the current account’s forwarding settings
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/PMailLang'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForwardSettingsRequest'}
      x-error-codes: {'200': [402, 403, 500], '400': [100], '403': [405], '405': [100]}

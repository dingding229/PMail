openapi: 3.1.0
info:
  title: PMail Pro HTTP API
  version: 4.0.0-dev
  description: |-
    C1 runtime contract. Cookie, Bearer token, and the legacy Token header are alternative credentials; authorization is recorded in x-permission (public, user, admin or owner). Owner routes are scoped to the caller's resource; any admin override is stated per operation.

    JSON responses use {errorNo, errorMsg, data} unless stated otherwise. Legacy failures can return HTTP 200. x-error-codes lists application codes by HTTP status. Don't infer success from HTTP status alone. Unregistered API URLs and unsupported attachment subpaths never return SPA HTML. The legacy setup endpoint is available only on the setup listener; when HTTPS is active the plain HTTP listener serves ping and ACME directly and redirects other requests to HTTPS. Listed GET/POST variants are supported contracts; incidental verbs accepted by some older handlers are not part of the contract.

    x-status: planned means not available in C1; the in-place planned POST DNS replacement is nested under x-planned-replacement. With development CORS enabled, allowlisted origins can send credentialed requests and preflight API/attachment paths. Cookie SameSite behavior is unchanged.
servers:
- {url: /}
security:
- {Session: []}
- {BearerToken: []}
- {LegacyToken: []}
x-application-error-codes:
  '100': Invalid parameters or credentials (or resource rejected by some legacy handlers).
  '402': Legacy setup required; API is not initialized.
  '403': Login required or session revoked.
  '405': Insufficient permission.
  '500': Server or delivery failure.
paths:
  /api/ping:
    get:
      operationId: pingGet
      tags: [Bootstrap]
      summary: Check HTTP liveness
      x-permission: public
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PongLiteralSuccess'}
    post:
      operationId: pingPost
      tags: [Bootstrap]
      summary: Check HTTP liveness
      x-permission: public
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PongLiteralSuccess'}
  /api/bootstrap:
    get:
      operationId: bootstrap
      tags: [Bootstrap]
      summary: Discover UI initialization state
      x-permission: public
      description: No login is required. A valid cookie or API token supplies the login state and domain names. Registration
        and the registration key endpoint are not implemented in C1.
      security:
      - {}
      - {Session: []}
      - {BearerToken: []}
      - {LegacyToken: []}
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      x-error-codes: {'200': [500], '500': [500], '503': [500]}
      responses:
        '200':
          description: Unwrapped JSON object on success; a legacy JSON error envelope may still be returned.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/Bootstrap'}
                - {$ref: '#/components/schemas/Error500'}
          headers:
            Cache-Control:
              schema: {const: no-store}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
    head:
      tags: [Bootstrap]
      x-permission: public
      description: No login is required. A valid cookie or API token supplies the login state and domain names. Registration
        and the registration key endpoint are not implemented in C1.
      security:
      - {}
      - {Session: []}
      - {BearerToken: []}
      - {LegacyToken: []}
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      x-error-codes: {'200': [500], '500': [500], '503': [500]}
      operationId: bootstrapHead
      summary: Discover UI initialization state (headers only)
      responses:
        '200':
          description: Unwrapped JSON object on success; a legacy JSON error envelope may still be returned.
          headers:
            Cache-Control:
              schema: {const: no-store}
        '500': {description: Error (no body).}
        '503': {description: Error (no body).}
  /api/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Authenticate and set the browser session
      x-permission: public
      security: []
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      x-error-codes: {'200': [100, 402, 500], '400': [100], '405': [100], '429': [100], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/LoginUserSuccess'}
                - {$ref: '#/components/schemas/Error100402500'}
          headers:
            Set-Cookie:
              description: Session cookie set/renewed, or cleared on logout/password change.
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Destroy the browser session
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      x-error-codes: {'200': [402, 403, 500], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/StringValueSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
          headers:
            Set-Cookie:
              description: Session cookie set/renewed, or cleared on logout/password change.
              schema: {type: string}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/setup:
    post:
      operationId: legacySetup
      tags: [Bootstrap]
      summary: Read or write a legacy setup step
      x-permission: public
      description: Available on the legacy uninitialized listener only; not a general configuration API. A non-matching
        step/action pair is not supported.
      security: []
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetupRequest'}
      x-error-codes: {'200': [402, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/SetupResultSuccess'}
                - {$ref: '#/components/schemas/Error402500'}
        '404':
          description: No such route or challenge token.
          content:
            text/plain:
              schema: {type: string}
  /api/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Create the first administrator with a one-time key
      x-permission: public
      description: Planned for C2. Establishes the same browser session as login.
      x-status: planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUserSuccess'}
          headers:
            Set-Cookie:
              description: Session cookie set/renewed, or cleared on logout/password change.
              schema: {type: string}
  /api/group:
    get:
      operationId: groupTreeGet
      tags: [Groups]
      summary: Get nested groups and built-in mailbox navigation tags
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      x-error-codes: {'200': [402, 403, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/GroupNodeListSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
    post:
      operationId: groupTreePost
      tags: [Groups]
      summary: Get nested groups and built-in mailbox navigation tags
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      x-error-codes: {'200': [402, 403, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/GroupNodeListSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
  /api/group/list:
    get:
      operationId: groupListGet
      tags: [Groups]
      summary: Get the flat group picker list
      x-permission: user
      description: Includes inbox, junk and deleted defaults plus custom groups.
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      x-error-codes: {'200': [402, 403, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/GroupListSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
    post:
      operationId: groupListPost
      tags: [Groups]
      summary: Get the flat group picker list
      x-permission: user
      description: Includes inbox, junk and deleted defaults plus custom groups.
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      x-error-codes: {'200': [402, 403, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/GroupListSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
  /api/group/add:
    post:
      operationId: createGroup
      tags: [Groups]
      summary: Create a mailbox group
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateGroupRequest'}
      x-error-codes: {'200': [402, 403, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/IntegerValueSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
  /api/group/del:
    post:
      operationId: deleteGroup
      tags: [Groups]
      summary: Delete a group owned by the caller
      x-permission: owner
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdRequest'}
      x-error-codes: {'200': [402, 403, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/BooleanValueSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
  /api/email/list:
    post:
      operationId: listMail
      tags: [Mail]
      summary: List or search messages
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MailListRequest'}
      x-error-codes: {'200': [402, 403, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/MailPageSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
  /api/email/detail:
    post:
      operationId: mailDetail
      tags: [Mail]
      summary: Read a message and mark it read
      x-permission: owner
      description: Mailbox members or admins only. The legacy handler reports inaccessible mail as errorNo 500. See MailListItem
        for the per-user read marker.
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdRequest'}
      x-error-codes: {'200': [100, 402, 403, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/EmailDetailSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
  /api/email/del:
    post:
      operationId: deleteMail
      tags: [Mail]
      summary: Delete messages from the current mailbox
      x-permission: owner
      description: Without forcedDel, moves mail to Deleted; forcedDel removes its mailbox links.
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeleteMessagesRequest'}
      x-error-codes: {'200': [100, 402, 403, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/SuccessLiteralSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
  /api/email/read:
    post:
      operationId: readMail
      tags: [Mail]
      summary: Mark messages read
      x-permission: owner
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageIdsRequest'}
      x-error-codes: {'200': [100, 402, 403, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/SuccessLiteralSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
  /api/email/move:
    post:
      operationId: moveMail
      tags: [Mail]
      summary: Move messages to a built-in or custom mailbox group
      x-permission: owner
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MoveMessagesRequest'}
      x-error-codes: {'200': [100, 402, 403, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/SuccessLiteralSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
  /api/email/send:
    post:
      operationId: sendMail
      tags: [Mail]
      summary: Send a message and report per-recipient delivery
      x-permission: user
      description: Select an authorized sending address (or omit it for the primary address). A complete delivery failure
        returns errorNo 500 with the delivery result when it is available.
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendMailRequest'}
      x-error-codes: {'200': [100, 402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/DeliveryResultSuccess'}
                - {$ref: '#/components/schemas/Error100402403500DeliveryData'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/email/forward:
    post:
      operationId: forwardMail
      tags: [Mail]
      summary: Forward a message with optional original attachments
      x-permission: owner
      description: Mailbox members or admins only. A complete delivery failure returns errorNo 500 with the per-recipient
        result when available.
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForwardMailRequest'}
      x-error-codes: {'200': [100, 402, 403, 500], '403': [405]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/DeliveryResultSuccess'}
                - {$ref: '#/components/schemas/Error100402403500DeliveryData'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/forward/get:
    get:
      operationId: getForwardSettingsGet
      tags: [Forwarding]
      summary: Read the current account’s forwarding settings
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      x-error-codes: {'200': [402, 403, 500], '405': [100], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/ForwardSettingsViewSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: getForwardSettingsPost
      tags: [Forwarding]
      summary: Read the current account’s forwarding settings
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      x-error-codes: {'200': [402, 403, 500], '405': [100], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/ForwardSettingsViewSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/forward/set:
    post:
      operationId: setForwardSettings
      tags: [Forwarding]
      summary: Set the current account’s forwarding settings
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForwardSettingsRequest'}
      x-error-codes: {'200': [402, 403, 500], '400': [100], '405': [100]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/ForwardSettingSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /api/rule/get:
    get:
      operationId: listRulesGet
      tags: [Rules]
      summary: List rules in descending sort order
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      x-error-codes: {'200': [402, 403, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/RuleNullableListSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
    post:
      operationId: listRulesPost
      tags: [Rules]
      summary: List rules in descending sort order
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      x-error-codes: {'200': [402, 403, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/RuleNullableListSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
  /api/rule/add:
    post:
      operationId: addRule
      tags: [Rules]
      summary: Create or update a rule owned by the caller
      x-permission: owner
      description: Both paths use the same upsert; positive id updates, while omitted or zero id inserts.
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleRequest'}
      x-error-codes: {'200': [100, 402, 403, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/SuccLiteralSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
  /api/rule/update:
    post:
      operationId: updateRule
      tags: [Rules]
      summary: Create or update a rule owned by the caller
      x-permission: owner
      description: Both paths use the same upsert; positive id updates, while omitted or zero id inserts.
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleRequest'}
      x-error-codes: {'200': [100, 402, 403, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/SuccLiteralSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
  /api/rule/del:
    post:
      operationId: deleteRule
      tags: [Rules]
      summary: Delete a rule owned by the caller
      x-permission: owner
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdRequest'}
      x-error-codes: {'200': [100, 402, 403, 500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/SuccLiteralSuccess'}
                - {$ref: '#/components/schemas/Error100402403500'}
  /api/queue/list:
    get:
      operationId: listQueueGet
      tags: [Queue]
      summary: List queued deliveries (all users for an administrator)
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      x-error-codes: {'200': [402, 403, 500], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/QueueItemNullableListSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: listQueuePost
      tags: [Queue]
      summary: List queued deliveries (all users for an administrator)
      x-permission: user
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      x-error-codes: {'200': [402, 403, 500], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/QueueItemNullableListSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/queue/retry:
    post:
      operationId: retryQueueItem
      tags: [Queue]
      summary: Retry a queued delivery
      x-permission: owner
      description: Queue item owner or admin. An invisible item is reported as not found.
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdRequest'}
      x-error-codes: {'200': [402, 403, 500], '400': [100], '404': [100], '405': [100], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/NullValueSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/queue/delete:
    post:
      operationId: deleteQueueItem
      tags: [Queue]
      summary: Delete a queued delivery
      x-permission: owner
      description: Queue item owner or admin. An invisible item is reported as not found.
      parameters:
      - {$ref: '#/components/parameters/Lang'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdRequest'}
      x-error-codes: {'200': [402, 403, 500], '400': [100], '404': [100], '405': [100], '500': [500]}
      responses:
        '200':
          description: Success or legacy application error; inspect errorNo.
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/NullValueSuccess'}
                - {$ref: '#/components/schemas/Error402403500'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/external/list:
    get:
      operationId: listExternalGet
      tags: [External]
      summary: List external mailboxes (all users for an administrator)
      x-permission: user
      parameters:

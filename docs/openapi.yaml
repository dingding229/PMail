        total: {type: integer, minimum: 0}
        id: {type: integer}
        label: {type: string}
        tag:
          type: string
          contentMediaType: application/json
          contentSchema: {$ref: '#/components/schemas/SearchTag'}
          examples: ['{"type":0,"status":-1,"group_id":0}', '{"starred":true}']
          description: A JSON-encoded SearchTag string, not a JSON object. Use the tag returned by /api/group.
        children:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/GroupNode'}
    Group:
      type: object
      required: [id, name, parent_id, full_path]
      properties:
        id:
          type: integer
          description: 'Built-in IDs: 2000000000 inbox, 2000000001 sent, 2000000002 drafts, 2000000003 deleted, and 2000000004
            junk.'
        name: {type: string}
        parent_id: {type: integer}
        full_path: {type: string}
    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        parent_id: {type: integer, default: 0}
    ForwardSetting:
      type: object
      required: [updated_iso, user_id, enabled, targets, keep_copy, updated]
      properties:
        updated_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        user_id: {type: integer}
        enabled: {type: boolean}
        targets:
          type: string
          contentMediaType: application/json
          contentSchema:
            type: array
            items: {type: string}
          description: Stored encoding (JSON array string or legacy comma-separated string); empty if not configured.
        keep_copy: {type: boolean}
        updated: {type: string, format: date-time}
    ForwardSettingsView:
      type: object
      required: [setting, targets]
      properties:
        setting: {$ref: '#/components/schemas/ForwardSetting'}
        targets:
          type: [array, 'null']
          items: {type: string}
    ForwardSettingsRequest:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
        targets:
          type: array
          items: {type: string}
        keep_copy: {type: boolean, default: true}
    RuleCondition:
      type: object
      required: [field, type, rule]
      properties:
        field:
          enum: [From, Subject, To, Cc, Text, Html, Content]
        type:

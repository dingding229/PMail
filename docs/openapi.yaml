components:
  securitySchemes:
    Session: {type: apiKey, in: cookie, name: session}
    BearerToken: {type: http, scheme: bearer}
    LegacyToken: {type: apiKey, in: header, name: Token}
  parameters:
    Lang:
      name: Lang
      in: header
      required: false
      schema: {type: string}
      description: Legacy response language header; defaults to en. The v4 bootstrap default_lang setting is for UI initialization.
    AttachmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*\.[0-9]+$
        examples: ['42.0']
      description: 'Composite ID: positive email ID, a dot, then the zero-based attachment Index from the detail response.'
    AttachmentEmailId:
      name: emailId
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    AttachmentCid:
      name: cid
      in: path
      required: true
      schema: {type: string}
      description: Original Content-ID (URL-encoded as one path segment).
    AttachmentIndex:
      name: index
      in: path
      required: true
      schema: {type: integer, minimum: 0}
    ChallengeToken:
      name: token
      in: path
      required: true
      schema: {type: string}
    DnsDomainId:
      name: id
      in: query
      required: true
      schema: {type: integer, minimum: 1}
    AddressUserId:
      name: user_id
      in: query
      required: false
      schema:
        type: integer
        description: Omit or use zero for the current account; only an administrator can select another user.
  responses:
    BadRequest:
      description: Invalid parameters or credentials (or resource rejected by some legacy handlers).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    Unauthorized:
      description: Login required or session revoked.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error403EmptyData'}
    Forbidden:
      description: Insufficient permission.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error405EmptyData'}
    NotFound:
      description: Resource not found or not visible to the caller.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    MethodNotAllowed:
      description: Unsupported HTTP method; when the controller handles the rejection, HTTP 405 is wrapped as errorNo
        100.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    Conflict:
      description: Operation conflicts with the resource state or uniqueness constraints.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    TooManyRequests:
      description: Login rate limit reached.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    InternalError:
      description: Server or delivery failure.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error500EmptyData'}
    Unavailable:
      description: Server or delivery failure.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error500EmptyData'}
  schemas:
    Envelope:
      type: object
      required: [errorNo, errorMsg, data]
      properties:
        errorNo: {type: integer}
        errorMsg: {type: string}
        data: {}
    Error100EmptyData:
      allOf:
      - {$ref: '#/components/schemas/Envelope'}
      - type: object
        properties:
          errorNo: {enum: [100]}
          errorMsg: {type: string}
          data: {const: ''}
    Error403EmptyData:
      allOf:
      - {$ref: '#/components/schemas/Envelope'}
      - type: object
        properties:
          errorNo: {enum: [403]}
          errorMsg: {type: string}
          data: {const: ''}
    Error405EmptyData:
      allOf:
      - {$ref: '#/components/schemas/Envelope'}
      - type: object
        properties:
          errorNo: {enum: [405]}
          errorMsg: {type: string}
          data: {const: ''}
    Error500EmptyData:
      allOf:
      - {$ref: '#/components/schemas/Envelope'}
      - type: object
        properties:
          errorNo: {enum: [500]}
          errorMsg: {type: string}
          data: {const: ''}
    IdRequest:
      type: object
      required: [id]
      properties:
        id: {type: integer, minimum: 1}
    MessageIdsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: {type: integer, minimum: 1}
          minItems: 1
    DeleteMessagesRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: {type: integer, minimum: 1}
          minItems: 1
        forcedDel: {type: boolean, default: false}
    MoveMessagesRequest:
      type: object
      required: [ids, group_id]
      properties:
        ids:
          type: array
          items: {type: integer, minimum: 1}
          minItems: 1
        group_id: {type: integer, description: Custom group ID or built-in group ID (see Group).}
        group_name: {type: string, description: Legacy input accepted by the decoder but ignored by this handler.}
    Credentials:
      type: object
      required: [account, password]
      properties:
        account: {type: string}
        password: {type: string, format: password, writeOnly: true}
    LoginUser:
      type: object
      required: [account, name, is_admin, domains]
      properties:
        account: {type: string}
        name: {type: string}
        is_admin: {type: integer, enum: [0, 1]}
        domains:
          type: array
          items: {type: string}
    UserInfo:
      type: object
      required: [account, name, is_admin, domains]
      properties:
        account: {type: string}
        name: {type: string}
        is_admin: {type: boolean}
        domains:
          type: array
          items: {type: string}
    Bootstrap:
      type: object
      required: [version, need_register, logged_in, default_lang, web_domain, domains, features]
      properties:
        version: {type: string, const: 4.0.0-dev}
        need_register:
          type: boolean
          description: True if no user exists (also true before the legacy setup listener has a DB). Disabled users still
            count.
        logged_in: {type: boolean}
        default_lang: {type: string, default: zh-CN}
        web_domain: {type: string}
        domains:
          type: array
          items: {type: string}
          description: Empty for anonymous callers.
        features:
          type: object
          required: [register_key]
          properties:
            register_key:
              type: boolean
              description: True advertises the v4 registration-key capability; POST /api/register itself is still planned
                in C1.
    RegisterRequest:
      type: object
      required: [registration_key, account, password]
      properties:
        registration_key: {type: string, writeOnly: true}
        account: {type: string}
        password: {type: string, format: password, writeOnly: true}
        display_name: {type: string}
    ChangePasswordRequest:
      type: object
      required: [old_password]
      properties:
        old_password: {type: string, format: password, writeOnly: true}
        new_password: {type: string, format: password, writeOnly: true}
        password:
          type: string
          format: password
          writeOnly: true
          description: Legacy alias for new_password; used when new_password is empty.
      anyOf:
      - required: [new_password]
      - required: [password]
    SearchTag:
      type: object
      required: [type, status, group_id]
      properties:
        type: {type: integer, enum: [-1, 0, 1], description: -1 any; 0 received; 1 sent.}
        status:
          type: integer
          description: 'Mailbox status: -1 any, 0 inbox/waiting, 1 sent, 2 failed, 3 deleted, 4 draft, 5 junk, 6 delivery
            pending.'
        group_id: {type: integer, description: -1 any; 0 default; positive custom group ID.}
    MailListRequest:
      type: object
      properties:
        keyword: {type: string}
        tag:
          type: string
          contentMediaType: application/json
          contentSchema: {$ref: '#/components/schemas/SearchTag'}
          examples: ['{"type":0,"status":-1,"group_id":0}']
          description: A JSON-encoded SearchTag string, not a JSON object. Use the tag returned by /api/group.
        current_page:
          type: integer
          description: One-based when supplied; zero/omission requests the first offset and the response echoes 0.
        page_size:
          type: integer
          default: 15
          description: Supply page_size explicitly with current_page > 1; the controller calculates the offset before
            applying its size default.
    MailAddress:
      type: object
      required: [Name, EmailAddress]
      properties:
        Name: {type: string}
        EmailAddress: {type: string}
    MailListItem:
      type: object
      required: [id, title, desc, datetime, is_read, sender, to, dangerous, error]
      properties:
        id: {type: integer}
        title: {type: string}
        desc: {type: string}
        datetime:
          type: string
          pattern: ^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$
          description: Server-local time formatted as YYYY-MM-DD HH:mm:ss, without a UTC offset.
        is_read: {type: boolean}
        sender: {$ref: '#/components/schemas/MailAddress'}
        to:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/MailAddress'}
        dangerous: {type: boolean, description: True if neither SPF nor DKIM passed.}
        error: {type: string}
    MailPage:
      type: object
      required: [current_page, total_page, list]
      properties:
        current_page: {type: integer}
        total_page: {type: integer, minimum: 0}
        list:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/MailListItem'}
    Attachment:
      type: object
      required: [Filename, ContentType, Index]
      properties:
        Filename: {type: string}
        ContentType: {type: string}
        Index: {type: integer, minimum: 0, description: Zero-based index; use <mail id>.<Index> for either new attachment
            route.}
    EmailDetail:
      type: object
      properties:
        id: {type: integer}
        type: {enum: [0, 1]}
        subject: {type: string}
        reply_to:
          type: string
          contentMediaType: application/json
          contentSchema:
            type: [array, 'null']
            items: {$ref: '#/components/schemas/MailAddress'}
          description: Legacy string containing JSON (or an empty string in older stored mail); decode before use.
        from_name: {type: string}
        from_address: {type: string}
        to:
          type: string
          contentMediaType: application/json
          contentSchema:
            type: [array, 'null']
            items: {$ref: '#/components/schemas/MailAddress'}
          description: Legacy string containing JSON (or an empty string in older stored mail); decode before use.
        bcc:
          type: string
          contentMediaType: application/json
          contentSchema:
            type: [array, 'null']
            items: {$ref: '#/components/schemas/MailAddress'}
          description: Legacy string containing JSON (or an empty string in older stored mail); decode before use.
        cc:
          type: string
          contentMediaType: application/json
          contentSchema:
            type: [array, 'null']
            items: {$ref: '#/components/schemas/MailAddress'}
          description: Legacy string containing JSON (or an empty string in older stored mail); decode before use.
        text: {type: string}
        html:
          type: string
          description: Stored HTML with cid links rewritten to the protected attachment API; render it in an isolated/sanitized
            reader.
        sender:
          type: string
          contentMediaType: application/json
          contentSchema:
            anyOf:
            - {$ref: '#/components/schemas/MailAddress'}
            - {type: 'null'}
          description: Legacy string containing JSON (or an empty string in older stored mail); decode before use.
        attachments:
          type: array
          items: {$ref: '#/components/schemas/Attachment'}
        spf_check: {type: integer, enum: [0, 1]}
        dkim_check: {type: integer, enum: [0, 1]}
        status:
          type: integer
          description: 0 waiting/inbound, 1 sent, 2 failed, 3 deleted/spoofed, 4 draft, 5 junk, 6 delivery pending.
        cron_send_time: {type: string, format: date-time}
        send_time:
          type: string
          pattern: ^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$
          description: Server-local time formatted as YYYY-MM-DD HH:mm:ss, without a UTC offset.
        update_time:
          type: string
          pattern: ^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$
          description: Server-local time formatted as YYYY-MM-DD HH:mm:ss, without a UTC offset.
        send_user_id: {type: integer}
        size: {type: integer}
        error: {type: string}
        send_date:
          type: string
          pattern: ^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$
          description: Server-local time formatted as YYYY-MM-DD HH:mm:ss, without a UTC offset.
        create_time:
          type: string
          pattern: ^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$
          description: Server-local time formatted as YYYY-MM-DD HH:mm:ss, without a UTC offset.
        msg_id: {type: string, description: Persisted RFC Message-ID.}
        text_format:
          enum: [plain, flowed, markdown, patch]
          x-status: planned
        has_code: {type: boolean, x-status: planned}
      required:
      - id
      - type
      - subject
      - reply_to
      - from_name
      - from_address
      - to
      - bcc
      - cc
      - text
      - html
      - sender
      - attachments
      - spf_check
      - dkim_check
      - status
      - cron_send_time
      - send_time
      - update_time
      - send_user_id
      - size
      - error
      - send_date
      - create_time
      - msg_id
      description: Only persisted/selected message headers are exposed here (Subject, From, Sender, Reply-To, To, Cc,
        Bcc, send_date and Message-ID); there is no raw headers map. Legacy Email.MarshalJSON also omits the embedded
        mailbox-only is_read, serial_number and ue_id fields.
    AttachmentPreview:
      type: object
      required: [filename, language, charset, truncated, size, content]
      properties:
        filename: {type: string}
        language: {type: string}
        charset: {type: string}
        truncated: {type: boolean}
        size: {type: integer, minimum: 0}
        content: {type: string}
    ComposeAddress:
      type: object
      required: [email]
      properties:
        name: {type: string}
        email: {type: string}
    ComposeAttachment:
      type: object
      required: [name, data]
      properties:
        name: {type: string}
        data: {type: string, description: 'Data URL in data:<mime>;base64,<bytes> form.'}
    SendMailRequest:
      type: object
      required: [to, subject]
      properties:
        reply_to:
          type: array
          items: {$ref: '#/components/schemas/ComposeAddress'}
          description: Legacy accepted field; not consumed by the current send handler.
        from:
          type: object
          properties:
            name: {type: string}
            email: {type: string}
        from_address: {type: string}
        to:
          type: array
          items: {$ref: '#/components/schemas/ComposeAddress'}
          minItems: 1
        bcc:
          type: array
          items: {$ref: '#/components/schemas/ComposeAddress'}
        cc:
          type: array
          items: {$ref: '#/components/schemas/ComposeAddress'}
        subject: {type: string, minLength: 1}
        text: {type: string}
        html: {type: string}
        sender: {$ref: '#/components/schemas/ComposeAddress', description: Optional explicit envelope sender.}
        read_receipt:
          type: array
          items: {type: string}
          description: Legacy accepted field; not consumed by the current send handler.
        attrs:
          type: array
          items: {$ref: '#/components/schemas/ComposeAttachment'}
    ForwardMailRequest:
      type: object
      required: [email_id, to]
      properties:
        email_id: {type: integer, minimum: 1}
        to:
          type: array
          items: {type: string}
          minItems: 1
        cc:
          type: array
          items: {type: string}
        text: {type: string}
        html: {type: string}
        from_address: {type: string}
        include_attachments: {type: boolean, default: true}
    RecipientDelivery:
      type: object
      required: [address, status, error]
      properties:
        address: {type: string}
        status:
          enum: [delivered, queued, failed]
        error: {type: string}
    DeliveryResult:
      type: object
      required: [status, recipients]
      properties:
        status:
          enum: [sent, queued, failed]
        recipients:
          type: array
          items: {$ref: '#/components/schemas/RecipientDelivery'}
    GroupNode:
      type: object
      required: [id, label, tag, children]
      properties:
        id: {type: integer}
        label: {type: string}
        tag:
          type: string
          contentMediaType: application/json
          contentSchema: {$ref: '#/components/schemas/SearchTag'}
          examples: ['{"type":0,"status":-1,"group_id":0}']
          description: A JSON-encoded SearchTag string, not a JSON object. Use the tag returned by /api/group.
        children:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/GroupNode'}
    Group:
      type: object
      required: [id, name, parent_id, full_path]
      properties:
        id:
          type: integer
          description: 'Built-in IDs: 2000000000 inbox, 2000000001 sent, 2000000002 drafts, 2000000003 deleted, and 2000000004
            junk.'
        name: {type: string}
        parent_id: {type: integer}
        full_path: {type: string}
    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        parent_id: {type: integer, default: 0}
    ForwardSetting:
      type: object
      required: [user_id, enabled, targets, keep_copy, updated]
      properties:
        user_id: {type: integer}
        enabled: {type: boolean}
        targets:
          type: string
          contentMediaType: application/json
          contentSchema:
            type: array
            items: {type: string}
          description: Stored encoding (JSON array string or legacy comma-separated string); empty if not configured.
        keep_copy: {type: boolean}
        updated: {type: string, format: date-time}
    ForwardSettingsView:
      type: object
      required: [setting, targets]
      properties:
        setting: {$ref: '#/components/schemas/ForwardSetting'}
        targets:
          type: [array, 'null']
          items: {type: string}
    ForwardSettingsRequest:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
        targets:
          type: array
          items: {type: string}
        keep_copy: {type: boolean, default: true}
    RuleCondition:
      type: object
      required: [field, type, rule]
      properties:
        field:
          enum: [From, Subject, To, Cc, Text, Html, Content]
        type:
          enum: [regex, contains, equal]
          description: Regular expression match, substring match, or full equality.
        rule: {type: string, description: Pattern for regex; literal for contains/equal.}
    Rule:
      type: object
      required: [id, user_id, name, rules, action, params, sort]
      properties:
        id: {type: integer, default: 0}
        user_id: {type: integer, readOnly: true}
        name: {type: string}
        rules:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/RuleCondition'}
          description: Every recognized condition must match (AND); an empty list matches all messages.
        action: {enum: [1, 2, 3, 4], description: 1 mark read; 2 forward; 3 move to deleted; 4 move to group.}
        params:
          type: string
          description: 'Action 2: one address, a comma-separated list, or a JSON-encoded string array. Action 4: a group
            ID encoded as a decimal string. Actions 1 and 3 ignore params.'
        sort: {type: integer, description: Higher values run first.}
    RuleRequest:
      type: object
      required: [name, rules, action]
      properties:
        id: {type: integer, default: 0}
        name: {type: string}
        rules:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/RuleCondition'}
          description: Every recognized condition must match (AND); an empty list matches all messages.
        action: {enum: [1, 2, 3, 4], description: 1 mark read; 2 forward; 3 move to deleted; 4 move to group.}
        params:
          type: string
          description: 'Action 2: one address, a comma-separated list, or a JSON-encoded string array. Action 4: a group
            ID encoded as a decimal string. Actions 1 and 3 ignore params.'
        sort: {type: integer, description: Higher values run first.}
    QueueItem:
      type: object
      properties:
        id: {type: integer}
        kind:
          enum: [send, forward, bounce]
        user_id: {type: integer}
        email_id: {type: integer}
        mail_from: {type: string}
        rcpt_to: {type: string}
        attempts: {type: integer}
        max_attempts: {type: integer}
        next_retry_at: {type: string, format: date-time}
        status:
          enum: [pending, sending, sent, failed]
        last_error: {type: string}
        created: {type: string, format: date-time}
        updated: {type: string, format: date-time}
      required: [id, kind, user_id, mail_from, rcpt_to, attempts, max_attempts, next_retry_at, status, last_error, created,
        updated]
    ExternalPreset:
      type: object
      required: [name, protocol, host, port, tls_mode]
      properties:
        name: {type: string}
        protocol:
          enum: [imap, pop3]
        host: {type: string}
        port: {type: integer, minimum: 0, maximum: 65535}
        tls_mode:
          enum: [tls, starttls, none]
    ExternalAccount:
      type: object
      required:
      - id
      - user_id
      - name
      - protocol
      - host
      - port
      - tls_mode
      - username
      - folder
      - interval_minutes
      - initial_days
      - delete_remote
      - target_group_id
      - enabled
      - insecure_skip_verify
      - last_sync_at
      - last_success_at
      - last_error
      - created
      - updated
      properties:
        id: {type: integer}
        user_id: {type: integer}
        name: {type: string}
        protocol:
          enum: [imap, pop3]
        host: {type: string}
        port: {type: integer, minimum: 0, maximum: 65535}
        tls_mode:
          enum: [tls, starttls, none]
        username: {type: string}
        folder: {type: string, default: INBOX}
        interval_minutes: {type: integer, description: Values below 2 use 10 minutes.}
        initial_days: {type: integer, description: Negative values use 30; 0 means no age cutoff.}
        delete_remote: {type: boolean}
        target_group_id: {type: integer}
        enabled: {type: boolean}
        insecure_skip_verify: {type: boolean}
        last_sync_at:
          type: [string, 'null']
          format: date-time
        last_success_at:
          type: [string, 'null']
          format: date-time
        last_error: {type: string}
        created: {type: string, format: date-time}
        updated: {type: string, format: date-time}
    ExternalCreateRequest:
      type: object
      required: [protocol, host, tls_mode, username, password]
      properties:
        name: {type: string}
        protocol:
          enum: [imap, pop3]
        host: {type: string}
        port: {type: integer, minimum: 0, maximum: 65535}
        tls_mode:
          enum: [tls, starttls, none]
        username: {type: string}
        folder: {type: string, default: INBOX}
        interval_minutes: {type: integer, description: Values below 2 use 10 minutes.}
        initial_days: {type: integer, description: Negative values use 30; 0 means no age cutoff.}
        delete_remote: {type: boolean}
        target_group_id: {type: integer}
        enabled: {type: boolean}
        insecure_skip_verify: {type: boolean}
        password: {type: string, format: password, writeOnly: true}
    ExternalUpdateRequest:
      type: object
      required: [id]
      properties:
        id: {type: integer, minimum: 1}
        name: {type: string}
        protocol:
          enum: [imap, pop3]
        host: {type: string}
        port: {type: integer, minimum: 0, maximum: 65535}
        tls_mode:
          enum: [tls, starttls, none]
        username: {type: string}
        folder: {type: string, default: INBOX}
        interval_minutes: {type: integer, description: Values below 2 use 10 minutes.}
        initial_days: {type: integer, description: Negative values use 30; 0 means no age cutoff.}
        delete_remote: {type: boolean}
        target_group_id: {type: integer}
        enabled: {type: boolean}
        insecure_skip_verify: {type: boolean}
        password: {type: string, format: password, writeOnly: true, description: Empty or omitted preserves the stored
            password.}
    ExternalTestRequest:
      type: object
      required: [protocol, host, tls_mode, username, password]
      properties:
        name: {type: string}
        protocol:
          enum: [imap, pop3]
        host: {type: string}
        port: {type: integer, minimum: 0, maximum: 65535}
        tls_mode:
          enum: [tls, starttls, none]
        username: {type: string}
        folder: {type: string, default: INBOX}
        interval_minutes: {type: integer, description: Values below 2 use 10 minutes.}
        initial_days: {type: integer, description: Negative values use 30; 0 means no age cutoff.}
        delete_remote: {type: boolean}
        target_group_id: {type: integer}
        enabled: {type: boolean}
        insecure_skip_verify: {type: boolean}
        password: {type: string, format: password, writeOnly: true}
    ExternalTestResult:
      type: object
      required: [folders]
      properties:
        folders:
          type: [array, 'null']
          items: {type: string}
    ExternalSyncResult:
      type: object
      required: [status, message]
      properties:
        status: {const: started}
        message: {const: external sync started}
    Domain:
      type: object
      required: [id, name, is_default, dkim_selector, created, updated]
      properties:
        id: {type: integer}
        name: {type: string}
        is_default: {type: boolean}
        dkim_selector: {type: string}
        created: {type: string, format: date-time}
        updated: {type: string, format: date-time}
    NewDomainRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
    LegacyDomainDnsRecord:
      type: object
      required: [type, name, expected, actual, match]
      properties:
        type:
          enum: [MX, TXT]
        name: {type: string}
        expected: {type: string}
        actual:

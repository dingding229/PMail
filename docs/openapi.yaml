components:
  securitySchemes:
    SetupToken:
      type: apiKey
      in: header
      name: X-PMail-Setup-Token
    Session: {type: apiKey, in: cookie, name: session}
    BearerToken: {type: http, scheme: bearer}
    LegacyToken: {type: apiKey, in: header, name: Token}
  parameters:
    ConfirmAttachmentRisk:
      name: confirm_risk
      in: query
      required: false
      schema: {type: string, const: '1'}
      description: Required to download high-risk bytes. Does not grant access or enable inline rendering. Risky bytes are always served as an attachment.
    PMailLang:
      name: X-PMail-Lang
      in: header
      required: false
      schema: {type: string}
      description: Preferred response language, before Accept-Language. A saved user preference takes precedence after
        authentication.
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: {type: string}
      description: Fallback response language; Chinese variants use Simplified Chinese. Defaults to the configured PMAIL_DEFAULT_LANG
        if both language headers are absent.
    AttachmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*\.[0-9]+$
        examples: ['42.0']
      description: 'Composite ID: positive email ID, a dot, then the zero-based attachment Index from the detail response.'
    AttachmentEmailId:
      name: emailId
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    AttachmentCid:
      name: cid
      in: path
      required: true
      schema: {type: string}
      description: Original Content-ID (URL-encoded as one path segment).
    AttachmentIndex:
      name: index
      in: path
      required: true
      schema: {type: integer, minimum: 0}
    ChallengeToken:
      name: token
      in: path
      required: true
      schema: {type: string}
    DnsDomainId:
      name: id
      in: query
      required: true
      schema: {type: integer, minimum: 1}
    AddressUserId:
      name: user_id
      in: query
      required: false
      schema:
        type: integer
        description: Omit or use zero for the current account; only an administrator can select another user.
  responses:
    C8InboundInvalidParameters:
      description: Localized error with a machine-readable data.code.
      content:
        application/json:
          schema:
            type: object
            required:
            - errorNo
            - errorMsg
            - data
            properties:
              errorNo:
                const: 100
              errorMsg:
                type: string
                minLength: 1
              data:
                type: object
                required:
                - code
                properties:
                  code:
                    type: string
                    enum:
                    - inbound_invalid_parameters
                additionalProperties: false
            additionalProperties: false
          examples:
            inbound_invalid_parameters_zh_CN:
              value:
                errorNo: 100
                errorMsg: 参数无效
                data:
                  code: inbound_invalid_parameters
            inbound_invalid_parameters_en:
              value:
                errorNo: 100
                errorMsg: Invalid parameters
                data:
                  code: inbound_invalid_parameters
    C8InboundLoginRequired:
      description: Localized error with a machine-readable data.code.
      content:
        application/json:
          schema:
            type: object
            required:
            - errorNo
            - errorMsg
            - data
            properties:
              errorNo:
                const: 403
              errorMsg:
                type: string
                minLength: 1
              data:
                type: object
                required:
                - code
                properties:
                  code:
                    type: string
                    enum:
                    - inbound_login_required
                additionalProperties: false
            additionalProperties: false
          examples:
            inbound_login_required_zh_CN:
              value:
                errorNo: 403
                errorMsg: 请先登录
                data:
                  code: inbound_login_required
            inbound_login_required_en:
              value:
                errorNo: 403
                errorMsg: Sign in first
                data:
                  code: inbound_login_required
    C8InboundPermissionDenied:
      description: Localized error with a machine-readable data.code.
      content:
        application/json:
          schema:
            type: object
            required:
            - errorNo
            - errorMsg
            - data
            properties:
              errorNo:
                const: 405
              errorMsg:
                type: string
                minLength: 1
              data:
                type: object
                required:
                - code
                properties:
                  code:
                    type: string
                    enum:
                    - inbound_permission_denied

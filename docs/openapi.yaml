components:
  securitySchemes:
    Session: {type: apiKey, in: cookie, name: session}
    BearerToken: {type: http, scheme: bearer}
    LegacyToken: {type: apiKey, in: header, name: Token}
  parameters:
    PMailLang:
      name: X-PMail-Lang
      in: header
      required: false
      schema: {type: string}
      description: Preferred response language, before Accept-Language. A saved user preference takes precedence after
        authentication.
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: {type: string}
      description: Fallback response language; Chinese variants use Simplified Chinese. Defaults to the configured PMAIL_DEFAULT_LANG
        if both language headers are absent.
    AttachmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*\.[0-9]+$
        examples: ['42.0']
      description: 'Composite ID: positive email ID, a dot, then the zero-based attachment Index from the detail response.'
    AttachmentEmailId:
      name: emailId
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    AttachmentCid:
      name: cid
      in: path
      required: true
      schema: {type: string}
      description: Original Content-ID (URL-encoded as one path segment).
    AttachmentIndex:
      name: index
      in: path
      required: true
      schema: {type: integer, minimum: 0}
    ChallengeToken:
      name: token
      in: path
      required: true
      schema: {type: string}
    DnsDomainId:
      name: id
      in: query
      required: true
      schema: {type: integer, minimum: 1}
    AddressUserId:
      name: user_id
      in: query
      required: false
      schema:
        type: integer
        description: Omit or use zero for the current account; only an administrator can select another user.
  responses:
    BadRequest:
      description: Invalid parameters or credentials (or resource rejected by some legacy handlers).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    Unauthorized:
      description: Login required or session revoked.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error403EmptyData'}
    Forbidden:
      description: Insufficient permission, first registration required, or first registration is not available.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error405EmptyData'}
    NotFound:
      description: Resource not found or not visible to the caller.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    MethodNotAllowed:
      description: Unsupported HTTP method; when the controller handles the rejection, HTTP 405 is wrapped as errorNo
        100.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    Conflict:
      description: Operation conflicts with the resource state or uniqueness constraints.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    UnsupportedMediaType:
      description: Attachment is not supported as text.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    TooManyRequests:
      description: Authentication or registration rate limit reached.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    InternalError:
      description: Server or delivery failure.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error500EmptyData'}
    Unavailable:
      description: Server or delivery failure.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error500EmptyData'}
    UnknownApiPath:
      description: Unmatched /api path (HTTP 404, independent of authentication).
      headers:
        Cache-Control:
          schema: {const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error404EmptyData'}
  schemas:
    Envelope:
      type: object
      required: [errorNo, errorMsg, data]
      properties:
        errorNo: {type: integer}
        errorMsg: {type: string}
        data: {}
    Error100EmptyData:
      allOf:
      - {$ref: '#/components/schemas/Envelope'}
      - type: object
        properties:
          errorNo: {enum: [100]}
          errorMsg: {type: string}
          data: {const: ''}
    Error403EmptyData:
      allOf:
      - {$ref: '#/components/schemas/Envelope'}
      - type: object
        properties:
          errorNo: {enum: [403]}
          errorMsg: {type: string}
          data: {const: ''}
    Error405EmptyData:
      allOf:
      - {$ref: '#/components/schemas/Envelope'}
      - type: object
        properties:
          errorNo: {enum: [405]}
          errorMsg: {type: string}
          data: {const: ''}
    Error500EmptyData:
      allOf:
      - {$ref: '#/components/schemas/Envelope'}
      - type: object
        properties:
          errorNo: {enum: [500]}
          errorMsg: {type: string}
          data: {const: ''}
    Error404EmptyData:
      allOf:
      - {$ref: '#/components/schemas/Envelope'}
      - type: object
        properties:
          errorNo: {enum: [404]}
          errorMsg: {type: string}
          data: {const: ''}
    IdRequest:
      type: object
      required: [id]
      properties:
        id: {type: integer, minimum: 1}
    MessageIdsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: {type: integer, minimum: 1}
          minItems: 1
    DeleteMessagesRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: {type: integer, minimum: 1}
          minItems: 1
        forcedDel: {type: boolean, default: false}
    MoveMessagesRequest:
      type: object
      required: [ids, group_id]
      properties:
        ids:
          type: array
          items: {type: integer, minimum: 1}
          minItems: 1
        group_id: {type: integer, description: Custom group ID or built-in group ID (see Group).}
        group_name: {type: string, description: Legacy input accepted by the decoder but ignored by this handler.}
    Credentials:
      type: object
      required: [account, password]
      properties:
        account: {type: string}
        password: {type: string, format: password, writeOnly: true}
    LoginUser:
      type: object
      required: [account, name, is_admin, domains]
      properties:
        account: {type: string}
        name: {type: string}
        is_admin: {type: integer, enum: [0, 1]}
        domains:
          type: array
          items: {type: string}
    UserInfo:
      type: object
      required: [account, name, is_admin, domains]
      properties:
        account: {type: string}
        name: {type: string}
        is_admin: {type: boolean}
        domains:
          type: array
          items: {type: string}
    Bootstrap:
      type: object
      required: [version, need_register, logged_in, default_lang, web_domain, domains, features]
      properties:
        version:
          type: string
          examples: [dev]
          description: Server build version injected by ldflags; dev if unset.
        need_register:
          type: boolean
          description: True only while configured, with zero users and no explicit PMAIL_ADMIN_PASSWORD. Disabled users
            count as existing users. False on the legacy configuration listener before registration is ready.
        logged_in: {type: boolean}
        default_lang: {type: string, default: zh-CN}
        web_domain: {type: string}
        domains:
          type: array
          items: {type: string}
          description: Empty for anonymous callers.
        features:
          type: object
          required: [register_key]
          properties:
            register_key: {type: boolean, description: True when the server supports one-time first administrator registration.}
    RegisterRequest:
      type: object
      required: [registration_key, account, password]
      properties:
        registration_key: {type: string, writeOnly: true, pattern: '^[A-HJ-NP-Z2-9]{4}(-[A-HJ-NP-Z2-9]{4}){3}$'}
        account: {type: string, maxLength: 20, description: Mailbox username without a domain; normalized to lowercase.}
        password: {type: string, format: password, writeOnly: true, minLength: 8}
        display_name: {type: string, maxLength: 50}
    ChangePasswordRequest:
      type: object
      required: [old_password]
      properties:
        old_password: {type: string, format: password, writeOnly: true}
        new_password: {type: string, format: password, writeOnly: true}
        password:
          type: string
          format: password
          writeOnly: true
          description: Legacy alias for new_password; used when new_password is empty.
      anyOf:
      - required: [new_password]
      - required: [password]
    SearchTag:
      type: object
      properties:
        type: {type: integer, enum: [-1, 0, 1], description: -1 any; 0 received; 1 sent.}
        status:
          type: integer
          description: 'Mailbox status: -1 any, 0 inbox/waiting, 1 sent, 2 failed, 3 deleted, 4 draft, 5 junk, 6 delivery
            pending.'
        group_id: {type: integer, description: -1 any; 0 default; positive custom group ID.}
        starred: {type: boolean, description: 'True selects starred messages outside Deleted, ignoring group_id/type/status.'}
    MailListRequest:
      type: object
      properties:
        keyword: {type: string}
        tag:
          type: string
          contentMediaType: application/json
          contentSchema: {$ref: '#/components/schemas/SearchTag'}
          examples: ['{"type":0,"status":-1,"group_id":0}', '{"starred":true}']
          description: A JSON-encoded SearchTag string, not a JSON object. Use the tag returned by /api/group.
        current_page:
          type: integer
          minimum: 0
          maximum: 1000000
          description: One-based when supplied; zero/omission selects the first offset and the response echoes 0.
        page_size: {type: integer, minimum: 1, maximum: 100, default: 15}
    MailAddress:
      type: object
      required: [Name, EmailAddress]
      properties:
        Name: {type: string}
        EmailAddress: {type: string}
    NormalizedMailAddress:
      type: object
      required: [name, address]
      properties:
        name: {type: string}
        address: {type: string}
    NormalizedMailAttachment:
      type: object
      required: [index, filename, content_type, size, content_id, inline, previewable]
      properties:
        index: {type: integer, minimum: 0}
        filename: {type: string}
        content_type: {type: string}
        size: {type: integer, minimum: 0}
        content_id: {type: string}
        inline: {type: boolean}
        previewable: {type: boolean}
    IsoTimestamp:
      type: [string, 'null']
      format: date-time
      description: RFC3339 date-time with an explicit UTC offset. Clients should use *_iso instead of legacy time fields.
        Null means unknown or unset.
    MailListItem:
      type: object
      required:
      - id

    PayloadTooLarge:
      description: The JSON body, recipient count, MIME part, attachment, or message exceeds a resource limit.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    JSONMediaTypeRequired:
      description: A JSON request body requires Content-Type application/json.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    BadRequest:
      description: Invalid parameters or credentials (or resource rejected by some legacy handlers).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    Unauthorized:
      description: Login required or session revoked.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error403EmptyData'}
    Forbidden:
      description: Insufficient permission, first registration required, or first registration is not available.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error405EmptyData'}
    NotFound:
      description: Resource not found or not visible to the caller.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    MethodNotAllowed:
      description: Unsupported HTTP method; when the controller handles the rejection, HTTP 405 is wrapped as errorNo
        100.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    Conflict:
      description: Operation conflicts with the resource state or uniqueness constraints.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    UnsupportedMediaType:
      description: Attachment is not supported as text.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    TooManyRequests:
      description: Authentication or registration rate limit reached.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error100EmptyData'}
    InternalError:
      description: Server or delivery failure.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error500EmptyData'}
    Unavailable:
      description: Server or delivery failure.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error500EmptyData'}
    UnknownApiPath:
      description: Unmatched /api path (HTTP 404, independent of authentication).
      headers:
        Cache-Control:
          schema: {const: no-store}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error404EmptyData'}
  schemas:
    C9AdminTelegram:
      type: object
      properties:
        configured:
          type: boolean
        bot_username:
          oneOf:
          - type: string
          - type: 'null'
        proxy_set:
          type: boolean
        webhook_mode:
          const: polling
      required:
      - configured
      - bot_username
      - proxy_set
      - webhook_mode
      additionalProperties: false
    C9AdminTelegramPatch:
      type: object
      properties:
        bot_token:
          type: string
          description: Omit to keep; empty clears. Never echoed.
        proxy:
          oneOf:
          - type: string
            description: http, https or socks5. Null or empty clears the stored proxy.
          - type: 'null'
      required: []
      additionalProperties: false
    C9TelegramTest:
      type: object
      properties:
        ok:
          type: boolean
        bot_username:
          type: string
        latency_ms:
          type: integer
          minimum: 0
      required:
      - ok
      - bot_username
      - latency_ms
      additionalProperties: false
    C9QuietHours:
      type: object
      properties:
        start:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
        end:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
        tz:
          type: string
          maxLength: 80
          description: IANA TZ name
      required:
      - start
      - end
      - tz
      additionalProperties: false
    C9TelegramFilters:
      type: object
      properties:
        group_ids:
          oneOf:
          - type: array
            items:
              type: integer
              minimum: 0
            maxItems: 100
          - type: 'null'
        only_verification:
          type: boolean
        include_spam:
          type: boolean
        include_preview:
          type: boolean
        quiet_hours:
          oneOf:
          - $ref: '#/components/schemas/C9QuietHours'
          - type: 'null'
      required:
      - group_ids
      - only_verification
      - include_spam
      - include_preview
      - quiet_hours
      additionalProperties: false
    C9TelegramUser:
      type: object
      properties:
        available:
          type: boolean
        bound:
          type: boolean
        chat_title:
          oneOf:
          - type: string
          - type: 'null'
        bound_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        filters:
          $ref: '#/components/schemas/C9TelegramFilters'
      required:
      - available
      - bound
      - chat_title
      - bound_at
      - filters
      additionalProperties: false
    C9TelegramFilterInput:
      type: object
      properties:
        filters:
          $ref: '#/components/schemas/C9TelegramFilters'
      required:
      - filters
      additionalProperties: false
    C9TelegramBind:
      type: object
      properties:
        code:
          type: string
        expires_at:
          type: string
          format: date-time
        deep_link:
          type: string
          format: uri
      required:
      - code
      - expires_at
      - deep_link
      additionalProperties: false
    C9UpdateInfo:
      type: object
      properties:
        current:
          type: string
        latest:
          oneOf:
          - type: string
          - type: 'null'
        has_update:
          type: boolean
        checked_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        check_error:
          oneOf:
          - type: string
            description: Localized display message.
          - type: 'null'
        releases:
          type: array
          items:
            $ref: '#/components/schemas/C9Release'
          maxItems: 20
        updater:
          type: object
          properties:
            enabled:
              type: boolean
            kind:
              oneOf:
              - type: string
              - type: 'null'
            reason: {type: string, description: Localized explanation when unavailable.}
          required:
          - enabled
          - kind
          additionalProperties: false
        job:
          $ref: '#/components/schemas/C9UpdateJob'
        manual_commands:
          type: array
          items:
            type: string
      required:
      - current
      - latest
      - has_update
      - checked_at
      - check_error
      - releases
      - updater
      - manual_commands
      additionalProperties: false
    C9Release:
      type: object
      properties:
        version:
          type: string
          pattern: ^v0\.[0-9]+\.[0-9]+$
        published_at:
          type: string
          description: RFC3339 when available; empty for an embedded entry without a publication date.
        notes_markdown:
          type: string
          description: Render Markdown without raw HTML and add rel="noopener noreferrer" to links.
        url:
          type: string
          format: uri
        is_current:
          type: boolean
      required:
      - version
      - published_at
      - notes_markdown
      - url
      - is_current
      additionalProperties: false
    C9UpdateJobRef:
      type: object
      properties:
        job_id:
          type: string
          pattern: ^[a-f0-9]{32}$
      required:
      - job_id
      additionalProperties: false
    C9UpdateJob:
      type: object
      properties:
        job_id: {type: string, pattern: '^[a-f0-9]{32}$'}
        version: {type: string}
        state:
          type: string
          enum:
          - pending
          - downloading
          - verifying
          - staging
          - restarting
          - done
          - failed
        message:
          oneOf:
          - type: string
          - type: 'null'
      required:
      - job_id
      - version
      - state
      - message
      additionalProperties: false
    C9InlineRef:
      type: object
      properties:
        cid:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - cid
      additionalProperties: false
    C9InlineUpload:
      type: object
      properties:
        cid:
          type: string
          pattern: ^[0-9a-f]{32}@pmail\.inline$
        url:
          type: string
        filename:
          type: string
        content_type:
          type: string
          enum:
          - image/png
          - image/jpeg
          - image/gif
          - image/webp
        size:
          type: integer
          minimum: 1
          maximum: 10485760
      required:
      - cid
      - url
      - filename
      - content_type
      - size
      additionalProperties: false
    C9SignatureInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        html:
          type: string
          description: Sanitized HTML. Limit is 64 KiB in UTF-8, not a character count.
        address_ids:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 100
          uniqueItems: true
        is_default:
          type: boolean
      required:
      - name
      - html
      - address_ids
      - is_default
      additionalProperties: false
    C9Signature:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        html:
          type: string
          description: Sanitized HTML. Limit is 64 KiB in UTF-8, not a character count.
        address_ids:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 100
          uniqueItems: true
        is_default:
          type: boolean
      required:
      - id
      - name
      - html
      - address_ids
      - is_default
      additionalProperties: false
    C9Error:
      type: object
      properties:
        errorNo:
          type: integer
          minimum: 1
        errorMsg:
          type: string
          minLength: 1
        data:
          type: object
          properties:
            code:
              type: string
          required:
          - code
          additionalProperties: false
      required:
      - errorNo
      - errorMsg
      - data
      additionalProperties: false
    MailSpamSummary:
      type: object
      required:
      - verdict
      properties:
        verdict:
          type: string
          enum:
          - ham
          - spam
          - unknown
      additionalProperties: false
    MailRiskSummary:
      type: object
      required:
      - level
      properties:
        level:
          type: string
          enum:
          - none
          - low
          - medium
          - high
      additionalProperties: false
    MailVerificationCodeSummary:
      type: object
      required:
      - code
      properties:
        kind:
          const: pickup
          description: Present only for pickup codes.
        code:
          type: string
          minLength: 1
      additionalProperties: false
    MailSpamAssessment:
      type: object
      required:
      - score
      - verdict
      - reasons
      properties:
        score:
          type: number
        verdict:
          type: string
          enum:
          - ham
          - spam
          - unknown
        reasons:
          type: array
          items:
            type: object
            required:
            - code
            - weight
            properties:
              code:
                type: string
                minLength: 1
              weight:
                type: number
              detail:
                type: string
            additionalProperties: false
      additionalProperties: false
    MailRiskAssessment:
      type: object
      required:
      - level
      - findings
      properties:
        level:
          type: string
          enum:
          - none
          - low
          - medium
          - high
        findings:
          type: array
          items:
            type: object
            required:
            - code
            - severity
            - location
            properties:
              code:
                type: string
                minLength: 1
              severity:
                type: string
                enum:
                - low
                - medium
                - high
              location:
                type: string
                enum:
                - body
                - attachment
              attachment_index:
                type: integer
                minimum: 0
                description: Zero-based; present for attachment findings.
              line:
                type: integer
                minimum: 1
              excerpt:
                type: string
                maxLength: 200
                description: Truncated, escaped diagnostic excerpt; render as text, never as markup.
            additionalProperties: false
      additionalProperties: false
    MailVerificationCode:
      type: object
      required:
      - code
      - confidence
      - source
      properties:
        kind:
          const: pickup
          description: Present only for pickup codes.
        code:
          type: string
          minLength: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: string
          enum:
          - subject
          - body
      additionalProperties: false
    MarkMailSpamRequest:
      type: object
      required:
      - ids
      - is_spam
      properties:
        ids:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 1
          maxItems: 50
          uniqueItems: true
        is_spam:
          type: boolean
      additionalProperties: false
    SpamSettings:
      type: object
      required:
      - enabled
      - threshold
      - bayes_enabled
      properties:
        enabled:
          type: boolean
        threshold:
          type: number
          minimum: 1
          maximum: 20
          default: 6
        bayes_enabled:
          type: boolean
      additionalProperties: false
    SpamRuleInput:
      type: object
      required:
      - action
      - kind
      - value
      properties:
        action:
          type: string
          enum:
          - allow
          - block
        kind:
          type: string
          enum:
          - address
          - domain
          - keyword
        value:
          type: string
          minLength: 1
          maxLength: 254
      additionalProperties: false
    InboundSettings:
      type: object
      required:
      - dnsbl_enabled
      - dnsbl_zones
      - default_spam_threshold
      - clamd_enabled
      - clamd_addr
      - risk_block_dangerous_attachments
      properties:
        dnsbl_enabled:
          type: boolean
        dnsbl_zones:
          type: array
          maxItems: 8
          description: DNSBL zone names; at least one zone is required when DNSBL is enabled.
          items:
            type: string
        default_spam_threshold:
          type: number
          minimum: 1
          maximum: 20
          default: 6
        clamd_enabled:
          type: boolean
        clamd_addr:
          type: string
          maxLength: 255
          description: Trusted scanner endpoint, as host:port or unix:/absolute/path. Required when enabled.
        risk_block_dangerous_attachments:
          type: boolean
          description: Additionally audit high-risk access attempts. Confirmation and preview rejection always apply.
        catch_all:
          type: object
          description: Optional on update. Zero chooses the oldest enabled administrator; the environment may override only the enabled switch.
          properties:
            enabled: {type: boolean}
            recipient_id: {type: integer, minimum: 0}
            env_controlled: {type: boolean, readOnly: true}
          additionalProperties: false
        catch_all_recipients:
          type: array
          readOnly: true
          items:
            type: object
            required: [id, account, name]
            properties:
              id: {type: integer, minimum: 1}
              account: {type: string}
              name: {type: string}
            additionalProperties: false
        warnings:
          type: array
          readOnly: true
          items: {$ref: '#/components/schemas/InboundWarning'}
      additionalProperties: false
    InboundWarning:
      type: object
      required: [code, message]
      properties:
        code: {type: string, enum: [dnsbl_unavailable, dnsbl_resolver_refused, clamd_unavailable]}
        zone: {type: string, description: DNSBL provider zone if applicable.}
        message: {type: string, description: Localized operational warning.}
      additionalProperties: false
    SpamRule:
      type: object
      required:
      - id
      - action
      - kind
      - value
      properties:
        id:
          type: integer
          minimum: 1
        action:
          type: string
          enum:
          - allow
          - block
        kind:
          type: string
          enum:
          - address
          - domain
          - keyword
        value:
          type: string
          minLength: 1
          maxLength: 254
      additionalProperties: false
    C8EmptySuccess:
      type: object
      required:
      - errorNo
      - errorMsg
      - data
      properties:
        errorNo:
          const: 0
        errorMsg:
          type: string
        data:
          const: ''
      additionalProperties: false
    SpamSettingsSuccess:
      type: object
      required:
      - errorNo
      - errorMsg
      - data
      properties:
        errorNo:
          const: 0
        errorMsg:
          type: string
        data:
          $ref: '#/components/schemas/SpamSettings'
      additionalProperties: false
    SpamRuleSuccess:
      type: object
      required:
      - errorNo
      - errorMsg
      - data
      properties:
        errorNo:
          const: 0
        errorMsg:
          type: string
        data:
          $ref: '#/components/schemas/SpamRule'
      additionalProperties: false
    SpamRulesSuccess:
      type: object
      required:
      - errorNo
      - errorMsg
      - data
      properties:
        errorNo:
          const: 0
        errorMsg:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/SpamRule'
          maxItems: 500
      additionalProperties: false
    InboundSettingsSuccess:
      type: object
      required:
      - errorNo
      - errorMsg
      - data
      properties:
        errorNo:
          const: 0
        errorMsg:
          type: string
        data:
          $ref: '#/components/schemas/InboundSettings'
      additionalProperties: false
    RiskPreviewForbidden:
      type: object
      required:
      - errorNo
      - errorMsg
      - data
      properties:
        errorNo:
          const: 405
        errorMsg:
          type: string
          minLength: 1
        data:
          type: object
          required:
          - code
          properties:
            code:
              type: string
              enum:
              - risk_preview_forbidden
          additionalProperties: false
      additionalProperties: false

    Envelope:
      type: object
      required: [errorNo, errorMsg, data]
      properties:
        errorNo: {type: integer}
        errorMsg: {type: string}
        data: {}
    Error100EmptyData:
      allOf:
      - {$ref: '#/components/schemas/Envelope'}
      - type: object
        properties:
          errorNo: {enum: [100]}
          errorMsg: {type: string}
          data: {const: ''}
    Error403EmptyData:
      allOf:
      - {$ref: '#/components/schemas/Envelope'}
      - type: object
        properties:
          errorNo: {enum: [403]}
          errorMsg: {type: string}
          data: {const: ''}
    Error405EmptyData:
      allOf:
      - {$ref: '#/components/schemas/Envelope'}
      - type: object
        properties:
          errorNo: {enum: [405]}
          errorMsg: {type: string}
          data: {const: ''}
    Error500EmptyData:
      allOf:
      - {$ref: '#/components/schemas/Envelope'}
      - type: object
        properties:
          errorNo: {enum: [500]}
          errorMsg: {type: string}
          data: {const: ''}
    Error404EmptyData:
      allOf:
      - {$ref: '#/components/schemas/Envelope'}
      - type: object
        properties:
          errorNo: {enum: [404]}
          errorMsg: {type: string}
          data: {const: ''}
    IdRequest:
      type: object
      required: [id]
      properties:
        id: {type: integer, minimum: 1}
    MessageIdsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: {type: integer, minimum: 1}
          minItems: 1
    DeleteMessagesRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: {type: integer, minimum: 1}
          minItems: 1
        forcedDel: {type: boolean, default: false}
    MoveMessagesRequest:
      type: object
      required: [ids, group_id]
      properties:
        ids:
          type: array
          items: {type: integer, minimum: 1}
          minItems: 1
        group_id: {type: integer, description: Custom group ID or built-in group ID (see Group).}
        group_name: {type: string, description: Legacy input accepted by the decoder but ignored by this handler.}
    Credentials:
      type: object
      required: [account, password]
      properties:
        account: {type: string}
        password: {type: string, format: password, writeOnly: true}
    LoginUser:
      type: object
      required: [account, name, is_admin, domains]
      properties:
        account: {type: string}
        name: {type: string}
        is_admin: {type: integer, enum: [0, 1]}
        domains:
          type: array
          items: {type: string}
    UserInfo:
      type: object
      required: [account, name, is_admin, domains]
      properties:
        account: {type: string}
        name: {type: string}
        is_admin: {type: boolean}
        domains:
          type: array
          items: {type: string}
    Bootstrap:
      type: object
      required: [version, need_register, logged_in, default_lang, web_domain, primary_domain, domains, features]
      properties:
        version:
          type: string
          examples: [dev]
          description: Server build version injected by ldflags; dev if unset.
        need_domain:
          type: boolean
          description: True on the first-run domain setup listener only; omitted on the normal server.
        need_register:
          type: boolean
          description: True during first-run domain setup, or after setup with zero users and no explicit
            PMAIL_ADMIN_PASSWORD. Disabled users count as existing users.
        logged_in: {type: boolean}
        default_lang: {type: string, default: zh-CN}
        web_domain: {type: string, description: Hostname of the web interface.}
        primary_domain:
          type: string
          description: Configured primary mail domain (PMAIL_DOMAIN), available even without a session.
        domains:
          type: array
          items: {type: string}
          description: Empty for anonymous callers.
        features:
          type: object
          required: [register_key]
          properties:
            register_key: {type: boolean, description: True when the server supports one-time first administrator registration.}
    RegisterRequest:
      type: object
      required: [registration_key, account, password]
      properties:
        registration_key: {type: string, writeOnly: true, pattern: '^[A-HJ-NP-Z2-9]{4}(-[A-HJ-NP-Z2-9]{4}){3}$'}
        account: {type: string, maxLength: 20, description: Mailbox username without a domain; normalized to lowercase.}
        password: {type: string, format: password, writeOnly: true, minLength: 8}
        display_name: {type: string, maxLength: 50}
    ChangePasswordRequest:
      type: object
      required: [old_password]
      properties:
        old_password: {type: string, format: password, writeOnly: true}
        new_password: {type: string, format: password, writeOnly: true}
        password:
          type: string
          format: password
          writeOnly: true
          description: Legacy alias for new_password; used when new_password is empty.
      anyOf:
      - required: [new_password]
      - required: [password]
    SearchTag:
      type: object
      properties:
        type: {type: integer, enum: [-1, 0, 1], description: -1 any; 0 received; 1 sent.}
        status:
          type: integer
          description: 'Mailbox status: -1 any, 0 inbox/waiting, 1 sent, 2 failed, 3 deleted, 4 draft, 5 junk, 6 delivery
            pending.'
        group_id: {type: integer, description: -1 any; 0 default; positive custom group ID.}
        starred: {type: boolean, description: 'True selects starred messages outside Deleted, ignoring group_id/type/status.'}
    MailListRequest:
      type: object
      properties:
        keyword: {type: string}
        tag:
          type: string
          contentMediaType: application/json
          contentSchema: {$ref: '#/components/schemas/SearchTag'}
          examples: ['{"type":0,"status":-1,"group_id":0}', '{"starred":true}']
          description: A JSON-encoded SearchTag string, not a JSON object. Use the tag returned by /api/group.
        current_page:
          type: integer
          minimum: 0
          maximum: 1000000
          description: One-based when supplied; zero/omission selects the first offset and the response echoes 0.
        page_size: {type: integer, minimum: 1, maximum: 100, default: 15}
        cursor:
          type: string
          maxLength: 256
          description: Omit for offset pagination; send an empty string for the first cursor page, then echo next_cursor with the same tag and keyword. Ignores current_page in cursor mode.
        include_total:
          type: boolean
          description: Defaults to true in offset mode and false in cursor mode. Set true to compute the exact total_page for the entire search, not just remaining rows.
    MailAddress:
      type: object
      required: [Name, EmailAddress]
      properties:
        Name: {type: string}
        EmailAddress: {type: string}
    NormalizedMailAddress:
      type: object
      required: [name, address]
      properties:
        name: {type: string}
        address: {type: string}
    NormalizedMailAttachment:
      type: object
      required: [index, filename, content_type, size, content_id, inline, previewable]
      properties:
        index: {type: integer, minimum: 0}
        filename: {type: string}
        content_type: {type: string}
        size: {type: integer, minimum: 0}
        content_id: {type: string}
        inline: {type: boolean}
        previewable: {type: boolean}
    IsoTimestamp:
      type: [string, 'null']
      format: date-time
      description: RFC3339 date-time with an explicit UTC offset. Clients should use *_iso instead of legacy time fields.
        Null means unknown or unset.
    MailAuthCheck:
      type: object
      required: [result, reason]
      properties:
        result: {type: string, enum: [pass, fail, none, neutral, softfail, temperror, permerror, not_applicable]}
        reason: {type: string, description: Stable machine-readable reason, not arbitrary DNS or mail data.}
        domain: {type: string, description: Authenticated/evaluated domain when known.}
        aligned: {type: boolean, description: Whether a passing identity aligned with the From domain.}
    MailAuthResults:
      type: [object, 'null']
      description: Null for legacy messages that lack detailed transport results. Trust is recorded separately and is not a protocol pass.
      required: [spf, dkim, dmarc, trusted_relay]
      properties:
        spf: {$ref: '#/components/schemas/MailAuthCheck'}
        dkim: {$ref: '#/components/schemas/MailAuthCheck'}
        dmarc:
          allOf: [{$ref: '#/components/schemas/MailAuthCheck'}]
          properties:
            policy: {type: string, enum: [none, quarantine, reject]}
        trusted_relay: {type: boolean}
    MailListItem:
      type: object
      required:
      - id
      - to_list
      - cc_list
      - bcc_list
      - reply_to_list
      - attachments_list
      - send_date_iso
      - create_time_iso
      - update_time_iso
      - send_time_iso
      - cron_send_time_iso
      - datetime_iso
      - is_draft
      - dangerous
      - auth_status
      - auth_results
      - spam
      - risk
      - verification_code
      - is_starred
      - title
      - desc
      - datetime
      - is_read
      - sender
      - to
      - error
      properties:
        spam:
          oneOf:
          - $ref: '#/components/schemas/MailSpamSummary'
          - type: 'null'
        risk:
          description: Null if the message has not been analyzed.
          oneOf:
          - $ref: '#/components/schemas/MailRiskSummary'
          - type: 'null'
        verification_code:
          oneOf:
          - $ref: '#/components/schemas/MailVerificationCodeSummary'
          - type: 'null'

        id: {type: integer}
        to_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAddress'}
        cc_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAddress'}
        bcc_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAddress'}
        reply_to_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAddress'}
        attachments_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAttachment'}
        send_date_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        create_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        update_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        send_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}

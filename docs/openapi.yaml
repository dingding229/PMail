        host: {type: string, description: 'Relative name to enter in DNS: e.g. @, mail or default._domainkey.'}
        fqdn: {type: string}
        zone: {type: string, description: DNS zone whose panel accepts the relative host (may differ for web hosts and
            PTR).}
        value: {type: string}
        value_chunks:
          type: array
          items: {type: string}
          description: TXT chunks of at most 255 bytes each; concatenate without spaces before comparison.
        suggested_value:
          type: string
          description: 'SPF only: when the current record does not authorize this server or multiple records exist, a
            proposed replacement retains mechanisms and the first record’s all policy, inserting missing mx/a before all.
            Review the suggestion; do not add another SPF record.'
        matches: {type: boolean, description: 'PTR targets match the mail host for each probed family, when known.'}
        priority: {type: integer}
        ttl: {type: integer}
        required: {type: boolean}
        status:
          enum: [ok, missing, mismatch, error, advice]
        actual:
          type: array
          items: {type: string}
        description: {type: string, description: Localized.}
        fix_hint: {type: string, description: Localized.}

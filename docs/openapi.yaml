      type: object
      required: [old_password]
      properties:
        old_password: {type: string, format: password, writeOnly: true}
        new_password: {type: string, format: password, writeOnly: true}
        password:
          type: string
          format: password
          writeOnly: true
          description: Legacy alias for new_password; used when new_password is empty.
      anyOf:
      - required: [new_password]
      - required: [password]
    SearchTag:
      type: object
      properties:
        type: {type: integer, enum: [-1, 0, 1], description: -1 any; 0 received; 1 sent.}
        status:
          type: integer
          description: 'Mailbox status: -1 any, 0 inbox/waiting, 1 sent, 2 failed, 3 deleted, 4 draft, 5 junk, 6 delivery
            pending.'
        group_id: {type: integer, description: -1 any; 0 default; positive custom group ID.}
        starred: {type: boolean, description: 'True selects starred messages outside Deleted, ignoring group_id/type/status.'}
    MailboxAddressFilter:
      description: Omit or use all for the existing view; other selects catch-all; a positive ID selects a mailbox address owned by the caller.
      oneOf:
      - {type: integer, minimum: 1}
      - {type: string, pattern: '^(all|other|[1-9][0-9]*)$'}
    MailboxAddressMatch:
      type: object
      required: [id, address, can_send, is_primary]
      properties:
        id: {type: integer, minimum: 1}
        address: {type: string}
        can_send: {type: boolean}
        is_primary: {type: boolean}
    MailboxAddressCounts:
      type: object
      required: [all_unread, addresses, other]
      properties:
        all_unread: {type: integer, minimum: 0}
        addresses:
          type: array
          items:
            allOf:
            - {$ref: '#/components/schemas/MailboxAddressMatch'}
            - type: object
              required: [unread]
              properties:
                unread: {type: integer, minimum: 0}
        other:
          type: object
          required: [unread, has_mail]
          properties:
            unread: {type: integer, minimum: 0}
            has_mail: {type: boolean, description: True if a retained catch-all message exists in any folder.}
    MailListRequest:
      type: object
      properties:
        address: {$ref: '#/components/schemas/MailboxAddressFilter'}
        keyword: {type: string}
        tag:
          type: string
          contentMediaType: application/json
          contentSchema: {$ref: '#/components/schemas/SearchTag'}
          examples: ['{"type":0,"status":-1,"group_id":0}', '{"starred":true}']
          description: A JSON-encoded SearchTag string, not a JSON object. Use the tag returned by /api/group.
        current_page:
          type: integer
          minimum: 0
          maximum: 1000000
          description: One-based when supplied; zero/omission selects the first offset and the response echoes 0.
        page_size: {type: integer, minimum: 1, maximum: 100, default: 15}
        cursor:
          type: string
          maxLength: 256
          description: Omit for offset pagination; send an empty string for the first cursor page, then echo next_cursor with the same tag and keyword. Ignores current_page in cursor mode.
        include_total:
          type: boolean
          description: Defaults to true in offset mode and false in cursor mode. Set true to compute the exact total_page for the entire search, not just remaining rows.
    MailAddress:
      type: object
      required: [Name, EmailAddress]
      properties:
        Name: {type: string}
        EmailAddress: {type: string}
    NormalizedMailAddress:
      type: object
      required: [name, address]
      properties:
        name: {type: string}
        address: {type: string}
    NormalizedMailAttachment:
      type: object
      required: [index, filename, content_type, size, content_id, inline, previewable]
      properties:
        index: {type: integer, minimum: 0}
        filename: {type: string}
        content_type: {type: string}
        size: {type: integer, minimum: 0}
        content_id: {type: string}
        inline: {type: boolean}
        previewable: {type: boolean}
    IsoTimestamp:
      type: [string, 'null']
      format: date-time
      description: RFC3339 date-time with an explicit UTC offset. Clients should use *_iso instead of legacy time fields.
        Null means unknown or unset.
    MailAuthCheck:
      type: object
      required: [result, reason]
      properties:
        result: {type: string, enum: [pass, fail, none, neutral, softfail, temperror, permerror, not_applicable]}
        reason: {type: string, description: Stable machine-readable reason, not arbitrary DNS or mail data.}
        domain: {type: string, description: Authenticated/evaluated domain when known.}
        aligned: {type: boolean, description: Whether a passing identity aligned with the From domain.}
    MailAuthResults:
      type: [object, 'null']
      description: Null for legacy messages that lack detailed transport results. Trust is recorded separately and is not a protocol pass.
      required: [spf, dkim, dmarc, trusted_relay]
      properties:
        spf: {$ref: '#/components/schemas/MailAuthCheck'}
        dkim: {$ref: '#/components/schemas/MailAuthCheck'}
        dmarc:
          allOf: [{$ref: '#/components/schemas/MailAuthCheck'}]
          properties:
            policy: {type: string, enum: [none, quarantine, reject]}
        trusted_relay: {type: boolean}
    TrashSettings:
      type: object
      required: [trash_retention_days]
      properties:
        trash_retention_days:
          type: integer
          minimum: 0
          maximum: 3650
          default: 30
          description: Number of 24-hour periods to keep Trash copies. Zero disables automatic cleanup.
    TrashSettingsResult:
      allOf:
      - {$ref: '#/components/schemas/Envelope'}
      - type: object
        properties:
          data: {$ref: '#/components/schemas/TrashSettings'}
    TrashDeleteResult:
      allOf:
      - {$ref: '#/components/schemas/Envelope'}
      - type: object
        properties:
          data:
            type: object
            required: [deleted]
            properties:
              deleted: {type: integer, minimum: 0}
    MailListItem:
      type: object
      required:
      - id
      - to_list
      - cc_list
      - bcc_list
      - reply_to_list
      - attachments_list
      - send_date_iso
      - create_time_iso
      - update_time_iso
      - send_time_iso
      - cron_send_time_iso
      - datetime_iso
      - is_draft
      - dangerous
      - auth_status
      - auth_results
      - spam
      - risk
      - verification_code
      - is_starred
      - title
      - desc
      - datetime
      - is_read
      - sender
      - to
      - error
      properties:
        deleted_at:
          type: [integer, 'null']
          format: int64
          description: Unix milliseconds at entry into Trash. Only present in Trash lists.
        purge_at:
          type: [integer, 'null']
          format: int64
          description: Only present in Trash lists. Null when retention is disabled or the deletion time is unavailable. Otherwise the cutoff in Unix milliseconds; the next hourly sweep that observes a strictly older deletion can purge it.
        mailbox_addresses:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddressMatch'}
        catch_all_addresses:
          type: array
          items: {type: string}
        spam:
          oneOf:
          - $ref: '#/components/schemas/MailSpamSummary'
          - type: 'null'
        risk:
          description: Null if the message has not been analyzed.
          oneOf:
          - $ref: '#/components/schemas/MailRiskSummary'
          - type: 'null'
        verification_code:
          oneOf:
          - $ref: '#/components/schemas/MailVerificationCodeSummary'
          - type: 'null'

        id: {type: integer}
        to_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAddress'}
        cc_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAddress'}
        bcc_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAddress'}
        reply_to_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAddress'}
        attachments_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAttachment'}
        send_date_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        create_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        update_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        send_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        cron_send_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        datetime_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        is_draft: {type: boolean}
        dangerous:
          type: boolean
          description: True for evaluated inbound mail with a failing authentication summary; false for drafts and outbound mail.
        auth_results: {$ref: '#/components/schemas/MailAuthResults'}
        auth_status:
          enum: [pass, fail, none, not_applicable]
          description: pass for aligned inbound authentication, fail for an evaluated failure, none for absent or inconclusive evidence, and not_applicable for drafts and outgoing mail. Older messages retain their legacy classification.
        is_starred: {type: boolean}
        title: {type: string}
        desc: {type: string, description: Bounded plain-text snippet; fetch mail detail for the full body.}
        datetime:
          type: string
          pattern: ^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$
          description: Legacy server-local YYYY-MM-DD HH:mm:ss without an offset; use the corresponding *_iso field for
            display and sorting.
        is_read: {type: boolean}
        sender: {$ref: '#/components/schemas/MailAddress'}
        to:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/MailAddress'}
        error: {type: string}
    MailPage:
      type: object
      required: [current_page, total_page, list]
      properties:
        current_page: {type: integer}
        total_page: {type: integer, minimum: 0, description: Zero when the total was not requested or when there are no messages.}
        next_cursor:
          type: string
          description: Present only in cursor mode; empty on the last page. Treat nonempty cursors as opaque.
        list:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/MailListItem'}
    Attachment:
      type: object
      required: [Filename, ContentType, Index]
      properties:
        Filename: {type: string}
        ContentType: {type: string}
        Index: {type: integer, minimum: 0, description: Zero-based index; use <mail id>.<Index> for either new attachment
            route.}
    EmailDetail:
      type: object
      properties:
        translation_available: {type: boolean}
        needs_translation: {type: boolean, description: Heuristic based on the target language writing system.}
        translation_engines: {type: array, items: {$ref: '#/components/schemas/C27Engine'}}
        ai_available: {type: boolean, description: The caller owns this mail, AI configuration is permitted, and the caller has saved an AI connection.}
        mailbox_addresses:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddressMatch'}
        spam:
          oneOf:
          - $ref: '#/components/schemas/MailSpamAssessment'
          - type: 'null'
        risk:
          description: Null if the message has not been analyzed.
          oneOf:
          - $ref: '#/components/schemas/MailRiskAssessment'
          - type: 'null'
        antivirus:
          type: object
          description: SMTP scan result when ClamAV was enabled. Rejected mail is not stored.
          required: [status]
          properties:
            status: {type: string, enum: [clean, not_scanned]}
            reason: {type: string}
        verification_code:
          oneOf:
          - $ref: '#/components/schemas/MailVerificationCode'
          - type: 'null'

        id: {type: integer}
        to_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAddress'}
        cc_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAddress'}
        bcc_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAddress'}
        reply_to_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAddress'}
        attachments_list:
          type: array
          items: {$ref: '#/components/schemas/NormalizedMailAttachment'}
        send_date_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        create_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        update_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        send_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        cron_send_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        is_draft: {type: boolean}
        dangerous:
          type: boolean
          description: True for evaluated inbound mail with a failing authentication summary; false for drafts and outbound mail.
        auth_results: {$ref: '#/components/schemas/MailAuthResults'}
        auth_status:
          enum: [pass, fail, none, not_applicable]
          description: pass for aligned inbound authentication, fail for an evaluated failure, none for absent or inconclusive evidence, and not_applicable for drafts and outgoing mail. Older messages retain their legacy classification.
        is_read: {type: boolean}
        is_starred: {type: boolean}
        mailbox_status: {type: integer}
        type: {enum: [0, 1]}
        subject: {type: string}
        reply_to:
          type: string
          contentMediaType: application/json
          contentSchema:
            type: [array, 'null']
            items: {$ref: '#/components/schemas/MailAddress'}
          description: Legacy string containing JSON (or an empty string in older stored mail); decode before use.
        from_name: {type: string}
        from_address: {type: string}
        to:
          type: string
          contentMediaType: application/json
          contentSchema:
            type: [array, 'null']
            items: {$ref: '#/components/schemas/MailAddress'}
          description: Legacy string containing JSON (or an empty string in older stored mail); decode before use.
        bcc:
          type: string
          contentMediaType: application/json
          contentSchema:
            type: [array, 'null']
            items: {$ref: '#/components/schemas/MailAddress'}
          description: Legacy string containing JSON (or an empty string in older stored mail); decode before use.
        cc:
          type: string
          contentMediaType: application/json
          contentSchema:
            type: [array, 'null']
            items: {$ref: '#/components/schemas/MailAddress'}
          description: Legacy string containing JSON (or an empty string in older stored mail); decode before use.
        text: {type: string, description: 'UTF-8 plain source, including literal markup characters.'}
        html:
          type: string
          description: Sanitized HTML with cid links rewritten to the protected attachment API; render it in an isolated/sanitized
            reader.
        sender:
          type: string
          contentMediaType: application/json
          contentSchema:
            anyOf:
            - {$ref: '#/components/schemas/MailAddress'}
            - {type: 'null'}
          description: Legacy string containing JSON (or an empty string in older stored mail); decode before use.
        attachments:
          type: array
          items: {$ref: '#/components/schemas/Attachment'}
        spf_check: {type: integer, enum: [0, 1]}
        dkim_check: {type: integer, enum: [0, 1]}
        status:
          type: integer
          description: 0 waiting/inbound, 1 sent, 2 failed, 3 deleted/spoofed, 4 draft, 5 junk, 6 delivery pending.
        cron_send_time: {type: string, format: date-time}
        send_time:
          type: string
          pattern: ^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$
          description: Legacy server-local YYYY-MM-DD HH:mm:ss without an offset; use the corresponding *_iso field for
            display and sorting.
        update_time:
          type: string
          pattern: ^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$
          description: Legacy server-local YYYY-MM-DD HH:mm:ss without an offset; use the corresponding *_iso field for
            display and sorting.
        send_user_id: {type: integer}
        size: {type: integer}
        error: {type: string}
        send_date:
          type: string
          pattern: ^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$
          description: Legacy server-local YYYY-MM-DD HH:mm:ss without an offset; use the corresponding *_iso field for
            display and sorting.
        create_time:
          type: string
          pattern: ^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$
          description: Legacy server-local YYYY-MM-DD HH:mm:ss without an offset; use the corresponding *_iso field for
            display and sorting.
        msg_id: {type: string, description: Persisted RFC Message-ID.}
        text_format:
          enum: [plain, flowed, markdown, patch]
        has_code:
          type: boolean
          description: True for recognizable patch content, fenced Markdown code, or HTML pre/code elements. Plain-text
            code without any of those markers is false.
      required:
      - id
      - to_list
      - cc_list
      - bcc_list
      - reply_to_list
      - attachments_list
      - send_date_iso
      - create_time_iso
      - update_time_iso
      - send_time_iso
      - cron_send_time_iso
      - is_draft
      - dangerous
      - auth_status
      - auth_results
      - spam
      - risk
      - verification_code
      - is_read
      - is_starred
      - mailbox_status
      - type
      - subject
      - reply_to
      - from_name
      - from_address
      - to
      - bcc
      - cc
      - text
      - html
      - sender
      - attachments
      - spf_check
      - dkim_check
      - status
      - cron_send_time
      - send_time
      - update_time
      - send_user_id
      - size
      - error
      - send_date
      - create_time
      - msg_id
      - text_format
      - has_code
      description: Only persisted/selected message headers are exposed here (Subject, From, Sender, Reply-To, To, Cc,
        Bcc, send_date and Message-ID); there is no raw headers map. Normalized address and attachment arrays are additional
        fields; the original encodings are retained. Render text as plain text, not HTML. mailbox_status is the caller’s
        per-folder status; serial_number and ue_id remain internal.
    AttachmentPreview:
      type: object
      required: [filename, language, charset, truncated, size, content]
      properties:
        filename: {type: string}
        language: {type: string}
        charset: {type: string}
        truncated: {type: boolean}
        size: {type: integer, minimum: 0}
        content: {type: string}
    ComposeAddress:
      type: object
      required: [email]
      properties:
        name: {type: string}
        email: {type: string}
    ComposeAttachment:
      type: object
      required: [name, data]
      properties:
        name: {type: string}
        data: {type: string, description: 'Data URL in data:<mime>;base64,<bytes> form.'}
    SendMailRequest:
      type: object
      required: [to, subject]
      properties:
        reply_to_email_id: {type: integer, minimum: 1, description: When no From was supplied use a send-enabled address associated with this original message before falling back to the primary address.}
        inline_images:
          type: array
          items:
            $ref: '#/components/schemas/C9InlineRef'
          maxItems: 20
          description: Each referenced CID must be authorized for the current user and used by an HTML image.
        draft_id:
          type: integer
          minimum: 1
          description: Optional owned draft ID. A sent or queued delivery removes that draft; a total failure keeps it.
            Omitted attrs reuse its saved attachments.
        reply_to:
          type: array
          items: {$ref: '#/components/schemas/ComposeAddress'}
          description: Legacy accepted field; not consumed by the current send handler.
        from:
          type: object
          properties:
            name: {type: string}
            email: {type: string}
        from_address: {type: string}
        to:
          type: array
          items: {$ref: '#/components/schemas/ComposeAddress'}
          minItems: 1
        bcc:
          type: array
          items: {$ref: '#/components/schemas/ComposeAddress'}
        cc:
          type: array
          items: {$ref: '#/components/schemas/ComposeAddress'}
        subject: {type: string, minLength: 1}
        text: {type: string}
        html: {type: string}
        sender: {$ref: '#/components/schemas/ComposeAddress', description: Optional explicit envelope sender.}
        read_receipt:
          type: array
          items: {type: string}
          description: Legacy accepted field; not consumed by the current send handler.
        attrs:
          type: array
          items: {$ref: '#/components/schemas/ComposeAttachment'}
    MarkReadRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: {type: integer, minimum: 1}
          minItems: 1
          maxItems: 500
        is_read: {type: boolean, default: true}
    StarRequest:
      type: object
      required: [ids, starred]
      properties:
        ids:
          type: array
          items: {type: integer, minimum: 1}
          minItems: 1
          maxItems: 500
        starred: {type: boolean}
    DraftSaveRequest:
      type: object
      properties:
        inline_images:
          type: array
          items:
            $ref: '#/components/schemas/C9InlineRef'
          maxItems: 20
          description: Each referenced CID must be authorized for the current user and used by an HTML image.
        id: {type: integer, minimum: 1}
        from_address: {type: string}
        to:
          type: array
          items: {$ref: '#/components/schemas/ComposeAddress'}
        cc:
          type: array
          items: {$ref: '#/components/schemas/ComposeAddress'}
        bcc:
          type: array
          items: {$ref: '#/components/schemas/ComposeAddress'}
        subject: {type: string}
        html: {type: string}
        text: {type: string}
        attrs:
          type: array
          items: {$ref: '#/components/schemas/ComposeAttachment'}
          description: Omit to keep saved attachments when updating; an explicit empty array removes them.
    DraftSaved:
      type: object
      required: [id, send_date_iso, create_time_iso, update_time_iso, send_time_iso, cron_send_time_iso]
      properties:
        id: {type: integer, minimum: 1}
        send_date_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        create_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        update_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        send_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
        cron_send_time_iso: {$ref: '#/components/schemas/IsoTimestamp'}
    DraftDeleteRequest:
      type: object
      properties:
        id: {type: integer, minimum: 1}
        ids:
          type: array
          items: {type: integer, minimum: 1}
          minItems: 1
          maxItems: 500
      anyOf:
      - required: [id]
      - required: [ids]
    ForwardMailRequest:
      type: object
      required: [email_id, to]
      properties:
        inline_images:
          type: array
          items:
            $ref: '#/components/schemas/C9InlineRef'
          maxItems: 20
          description: Each referenced CID must be authorized for the current user and used by an HTML image.
        email_id: {type: integer, minimum: 1}
        to:
          type: array
          items: {type: string}
          minItems: 1
        cc:
          type: array
          items: {type: string}
        text: {type: string}
        html: {type: string}
        from_address: {type: string}
        include_attachments: {type: boolean, default: true}
    RecipientDelivery:
      type: object
      required: [address, status, error]
      properties:
        address: {type: string}
        status:
          enum: [delivered, queued, failed]
        error: {type: string}
    DeliveryResult:
      type: object
      required: [status, recipients]
      properties:
        status:
          enum: [sent, queued, failed]
        recipients:
          type: array
          items: {$ref: '#/components/schemas/RecipientDelivery'}
    GroupNode:
      type: object
      required: [id, label, tag, children]
      properties:

        auth_results: {$ref: '#/components/schemas/MailAuthResults'}
        auth_status:
          enum: [pass, fail, none, not_applicable]
          description: pass for aligned inbound authentication, fail for an evaluated failure, none for absent or inconclusive evidence, and not_applicable for drafts and outgoing mail. Older messages retain their legacy classification.
        is_starred: {type: boolean}
        title: {type: string}
        desc: {type: string, description: Bounded plain-text snippet; fetch mail detail for the full body.}
        datetime:
          type: string
          pattern: ^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$
          description: Legacy server-local YYYY-MM-DD HH:mm:ss without an offset; use the corresponding *_iso field for
            display and sorting.
        is_read: {type: boolean}
        sender: {$ref: '#/components/schemas/MailAddress'}
        to:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/MailAddress'}
        error: {type: string}
    MailPage:
      type: object

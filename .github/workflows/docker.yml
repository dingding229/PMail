name: Docker image

# 构建 linux/amd64 + linux/arm64 镜像并推送到 Docker Hub。
# 需要在仓库 Settings → Secrets and variables → Actions 中配置：
#   Variables: DOCKERHUB_USERNAME（Docker Hub 用户名或组织名）
#              DOCKERHUB_IMAGE（可选，默认 <DOCKERHUB_USERNAME>/pmail）
#   Secrets:   DOCKERHUB_TOKEN（Docker Hub Access Token，需 Read & Write 权限）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '额外的镜像 tag（可留空）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/pmail', vars.DOCKERHUB_USERNAME) }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=0
          [ -n "$DOCKERHUB_USERNAME" ] || { echo "::error::缺少仓库变量 DOCKERHUB_USERNAME"; missing=1; }
          [ -n "$DOCKERHUB_TOKEN" ] || { echo "::error::缺少仓库密钥 DOCKERHUB_TOKEN"; missing=1; }
          exit $missing

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GITHASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 已推送到 Docker Hub"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

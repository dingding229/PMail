name: PMail Pro Docker image

# Only release tags publish. DOCKERHUB_TOKEN needs write access to pmail-pro.
# DOCKERHUB_USERNAME is optional (defaults to dingding229).
on:
  push:
    tags:
      - 'v0.*.*'

permissions:
  contents: read

concurrency:
  group: docker-release
  cancel-in-progress: false

env:
  IMAGE: dingding229/pmail-pro

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_time: ${{ steps.version.outputs.build_time }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check release tag and version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          node -e 'const v = require("./package.json").version, lock = require("./package-lock.json"); if (lock.version !== v || lock.packages[""].version !== v) process.exit(1)'
          make -C .. check-version VERSION="$version"
          if [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Git release tag must equal v followed by the package version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_time=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run build
        env:
          VITE_MOCK: "0"

  signed-assets:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Build the same program and web files as the image
        env:
          VERSION: ${{ needs.frontend.outputs.version }}
          BUILD_TIME: ${{ needs.frontend.outputs.build_time }}
        run: |
          docker buildx build --target release-files --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$VERSION" --build-arg "GITHASH=$GITHUB_SHA" --build-arg "BUILD_TIME=$BUILD_TIME" \
            --output "type=local,dest=$RUNNER_TEMP/pmail-files" .
          mkdir "$RUNNER_TEMP/pmail-release"
          for arch in amd64 arm64; do
            dir="$RUNNER_TEMP/pmail-files/linux_$arch"
            test -x "$dir/pmail"
            test -f "$dir/web/index.html"
            tar -C "$dir" -czf "$RUNNER_TEMP/pmail-release/pmail-linux-$arch.tar.gz" pmail web
          done
          python3 deploy/release-notes.py "$VERSION" > "$RUNNER_TEMP/pmail-release/notes.md"
      - name: Sign release checksums
        working-directory: server
        env:
          PMAIL_RELEASE_SIGNING_KEY: ${{ secrets.PMAIL_RELEASE_SIGNING_KEY }}
        run: go run ./cmd/pmail-sign "$GITHUB_REF_NAME" "$RUNNER_TEMP/pmail-release"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: ${{ runner.temp }}/pmail-release/
          if-no-files-found: error

  publish:
    needs: [frontend, signed-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'dingding229' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish PMail Pro
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:v${{ needs.frontend.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.frontend.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ needs.frontend.outputs.version }}
            GITHASH=${{ github.sha }}
            BUILD_TIME=${{ needs.frontend.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release
          path: release
      - name: Publish the signed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file release/notes.md \
            release/pmail-linux-amd64.tar.gz release/pmail-linux-arm64.tar.gz \
            release/checksums.txt release/checksums.txt.sig

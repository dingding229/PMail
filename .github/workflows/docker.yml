name: PMail Pro Docker image

# Only release tags publish to Docker Hub. DOCKERHUB_TOKEN needs write access to both repositories.
# DOCKERHUB_USERNAME is optional (defaults to dingding229).
on:
  push:
    tags:
      - 'v0.*.*'

permissions:
  contents: read

concurrency:
  group: docker-release
  cancel-in-progress: false

env:
  IMAGE: dingding229/pmail-pro
  UPDATER_IMAGE: dingding229/pmail-pro-updater

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check release tag and version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          node -e 'const v = require("./package.json").version, lock = require("./package-lock.json"); if (lock.version !== v || lock.packages[""].version !== v) process.exit(1)'
          make -C .. check-version VERSION="$version"
          if [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Git release tag must equal v followed by the package version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run build
        env:
          VITE_MOCK: "0"

  publish:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'dingding229' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish PMail Pro
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:v${{ needs.frontend.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.frontend.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ needs.frontend.outputs.version }}
            GITHASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish PMail Pro updater
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.updater
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.UPDATER_IMAGE }}:latest
            ${{ env.UPDATER_IMAGE }}:v${{ needs.frontend.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.frontend.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pmail-updater
          cache-to: type=gha,mode=max,scope=pmail-updater

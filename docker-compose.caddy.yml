services:
  pmail:
    # Caddy owns the host web ports. PMail still uses HTTP-01 for mail TLS.
    environment:
      PMAIL_SSL_TYPE: "0"
      PMAIL_HTTPS_ENABLED: "2"
    ports: !override
      - "${PMAIL_MAIL_BIND:-0.0.0.0}:${PMAIL_HOST_SMTP_PORT:-25}:25"
      - "${PMAIL_MAIL_BIND:-0.0.0.0}:${PMAIL_HOST_SMTPS_PORT:-465}:465"
      - "${PMAIL_MAIL_BIND:-0.0.0.0}:${PMAIL_HOST_SUBMISSION_PORT:-587}:587"
      - "${PMAIL_MAIL_BIND:-0.0.0.0}:${PMAIL_HOST_POP3_PORT:-110}:110"
      - "${PMAIL_MAIL_BIND:-0.0.0.0}:${PMAIL_HOST_POP3S_PORT:-995}:995"
      - "${PMAIL_MAIL_BIND:-0.0.0.0}:${PMAIL_HOST_IMAP_PORT:-143}:143"
      - "${PMAIL_MAIL_BIND:-0.0.0.0}:${PMAIL_HOST_IMAPS_PORT:-993}:993"
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      pmail:
        condition: service_started
    environment:
      PMAIL_DOMAIN: ${PMAIL_DOMAIN:?set PMAIL_DOMAIN in .env}
      PMAIL_WEB_DOMAIN: ${PMAIL_WEB_DOMAIN:?set PMAIL_WEB_DOMAIN in .env}
      PMAIL_HTTP_PORT: ${PMAIL_HTTP_PORT:-80}
    ports:
      - "${PMAIL_WEB_BIND:-0.0.0.0}:${PMAIL_HOST_HTTP_PORT:-80}:80"
      - "${PMAIL_WEB_BIND:-0.0.0.0}:${PMAIL_HOST_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
volumes:
  caddy_data:
  caddy_config:

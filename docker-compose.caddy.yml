services:
  pmail:
    # Caddy terminates web HTTPS. PMail keeps its internal HTTP listener and
    # can still obtain mail-protocol certificates with its own ACME mode.
    environment:
      PMAIL_SSL_TYPE: "0"
      PMAIL_HTTPS_ENABLED: "0"
    ports: !override []
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      pmail:
        condition: service_started
    environment:
      PMAIL_WEB_DOMAIN: ${PMAIL_WEB_DOMAIN:?set PMAIL_WEB_DOMAIN in .env}
      PMAIL_HTTP_PORT: ${PMAIL_HTTP_PORT:-80}
    ports:
      - "${PMAIL_WEB_BIND:-0.0.0.0}:${PMAIL_HOST_HTTP_PORT:-80}:80"
      - "${PMAIL_WEB_BIND:-0.0.0.0}:${PMAIL_HOST_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
volumes:
  caddy_data:
  caddy_config:

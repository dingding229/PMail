# PMail Pro —— 下载本文件后执行 `docker compose up -d`，然后在网页上完成设置。
# 不需要填写任何变量。高级选项可写在同目录的 .env 文件中（可选），见 README。

name: pmail

services:
  pmail:
    image: dingding229/pmail-pro:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    ports:
      # 邮件端口
      - "25:25"
      - "465:465"
      - "587:587"
      - "110:110"
      - "995:995"
      - "143:143"
      - "993:993"
      # 网页：只供本机反向代理（NPM、Nginx）访问，反代上游填 172.17.0.1:8080
      - "172.17.0.1:8080:80"
    volumes:
      - pmail_config:/work/config
      - secrets:/run/pmail-secrets:ro
    networks: [default, update-private]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: pmail
      POSTGRES_USER: pmail
      POSTGRES_PASSWORD_FILE: /run/pmail-secrets/db_password
    volumes:
      - pg_data:/var/lib/postgresql/data
      - secrets:/run/pmail-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pmail -d pmail"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 首次启动时生成数据库密码，之后不再运行。
  init-secrets:
    image: dingding229/pmail-pro:latest
    command: ["/work/pmail", "init-secrets", "/run/pmail-secrets/db_password"]
    restart: "no"
    healthcheck:
      disable: true
    volumes:
      - secrets:/run/pmail-secrets

  # 可选：网页一键更新。在 .env 中设置 PMAIL_UPDATER_TOKEN 后执行
  # `docker compose --profile updater up -d` 启用。
  updater:
    profiles: ["updater"]
    image: dingding229/pmail-pro-updater:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PMAIL_UPDATER_PROJECT: pmail
    networks: [update-private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/project:ro
      - updater_state:/state

networks:
  update-private:
    internal: true

volumes:
  pg_data:
  pmail_config:
  secrets:
  updater_state:

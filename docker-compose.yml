name: ${PMAIL_PROJECT_NAME:-pmail}

# 同一镜像用于运行服务及初始化数据库密码。
# 固定版本：在 .env 设置 PMAIL_IMAGE=dingding229/pmail-pro:v0.0.1。
x-pmail-image: &pmail-image ${PMAIL_IMAGE:-dingding229/pmail-pro:latest}

services:
  init-secrets:
    image: *pmail-image
    command: ["/work/pmail", "init-secrets", "/run/pmail-secrets/db_password"]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - secrets:/run/pmail-secrets
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmail}
      POSTGRES_USER: ${POSTGRES_USER:-pmail}
      POSTGRES_PASSWORD_FILE: /run/pmail-secrets/db_password
    volumes:
      - pg_data:/var/lib/postgresql/data
      - secrets:/run/pmail-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  pmail:
    image: *pmail-image
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/work/pmail", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 75s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PMAIL_DB_TYPE: postgres
      PMAIL_DB_DSN: ${PMAIL_DB_DSN:-}
      PMAIL_DB_PASSWORD_FILE: /run/pmail-secrets/db_password
      PMAIL_DB_USER: ${POSTGRES_USER:-pmail}
      PMAIL_DB_NAME: ${POSTGRES_DB:-pmail}
      PMAIL_DOMAIN: ${PMAIL_DOMAIN:?请在 .env 中填写 PMAIL_DOMAIN}
      PMAIL_DOMAINS: ${PMAIL_DOMAINS:-}
      PMAIL_WEB_ROOT: ${PMAIL_WEB_ROOT:-/work/web}
      PMAIL_CORS_ORIGINS: ${PMAIL_CORS_ORIGINS:-}
      PMAIL_LEGACY_SETUP: "${PMAIL_LEGACY_SETUP:-0}"
      PMAIL_TRUSTED_RELAYS: "${PMAIL_TRUSTED_RELAYS:-}"
      PMAIL_POP3_ALLOW_PLAINTEXT_AUTH: "${PMAIL_POP3_ALLOW_PLAINTEXT_AUTH:-false}"
      PMAIL_MAIL_JSON_MAX_BYTES: "${PMAIL_MAIL_JSON_MAX_BYTES:-33554432}"
      PMAIL_POP3_MAX_CONNECTIONS: "${PMAIL_POP3_MAX_CONNECTIONS:-128}"
      PMAIL_POP3_MAX_PER_IP: "${PMAIL_POP3_MAX_PER_IP:-8}"
      PMAIL_POP3_IDLE_SECONDS: "${PMAIL_POP3_IDLE_SECONDS:-600}"
      PMAIL_SMTP_OUTBOUND_ALLOW: "${PMAIL_SMTP_OUTBOUND_ALLOW:-}"
      PMAIL_SMTP_TLS_REQUIRED_DOMAINS: "${PMAIL_SMTP_TLS_REQUIRED_DOMAINS:-}"
      PMAIL_TRUSTED_PROXIES: "${PMAIL_TRUSTED_PROXIES:-}"
      PMAIL_ADMIN_MAIL_ACCESS: "${PMAIL_ADMIN_MAIL_ACCESS:-0}"
      PMAIL_PRINT_REGISTRATION_KEY: "${PMAIL_PRINT_REGISTRATION_KEY:-0}"
      PMAIL_PUBLIC_IPV4: ${PMAIL_PUBLIC_IPV4:-}
      PMAIL_PUBLIC_IPV6: ${PMAIL_PUBLIC_IPV6:-}
      PMAIL_DNS_RESOLVER: ${PMAIL_DNS_RESOLVER:-}
      PMAIL_DEFAULT_LANG: ${PMAIL_DEFAULT_LANG:-zh-CN}
      PMAIL_WEB_DOMAIN: ${PMAIL_WEB_DOMAIN:-}
      PMAIL_HTTP_PORT: ${PMAIL_HTTP_PORT:-80}
      PMAIL_HTTPS_PORT: ${PMAIL_HTTPS_PORT:-443}
      PMAIL_WEB_MODE: ${PMAIL_WEB_MODE:-proxy}
      PMAIL_HTTPS_ENABLED: ${PMAIL_HTTPS_ENABLED:-}
      PMAIL_SSL_TYPE: ${PMAIL_SSL_TYPE:-}
      PMAIL_LOG_LEVEL: ${PMAIL_LOG_LEVEL:-info}
      PMAIL_CATCH_ALL: ${PMAIL_CATCH_ALL:-true}
      PMAIL_ALLOW_USER_ALIAS: ${PMAIL_ALLOW_USER_ALIAS:-false}
      PMAIL_SPAM_FILTER_LEVEL: ${PMAIL_SPAM_FILTER_LEVEL:-0}
      PMAIL_SPAM_KEYWORDS:
      PMAIL_TELEGRAM_PROXY:
      PMAIL_TELEGRAM_API_BASE:
      PMAIL_PUBLIC_URL:
      PMAIL_UPDATE_CHECK: ${PMAIL_UPDATE_CHECK:-1}
      PMAIL_UPDATER_ENABLED: ${PMAIL_UPDATER_ENABLED:-0}
      PMAIL_UPDATER_TOKEN:

      PMAIL_SECRET_KEY: ${PMAIL_SECRET_KEY:-}
      PMAIL_ADMIN_ACCOUNT: ${PMAIL_ADMIN_ACCOUNT:-admin}
      PMAIL_ADMIN_PASSWORD: ${PMAIL_ADMIN_PASSWORD:-}
    networks: [default, update-private]
    volumes:
      - pmail_config:/work/config
      - secrets:/run/pmail-secrets:ro
    ports:
      - "${PMAIL_MAIL_BIND:-0.0.0.0}:${PMAIL_HOST_SMTP_PORT:-25}:25"
      - "${PMAIL_MAIL_BIND:-0.0.0.0}:${PMAIL_HOST_SMTPS_PORT:-465}:465"
      - "${PMAIL_MAIL_BIND:-0.0.0.0}:${PMAIL_HOST_SUBMISSION_PORT:-587}:587"
      - "${PMAIL_MAIL_BIND:-0.0.0.0}:${PMAIL_HOST_POP3_PORT:-110}:110"
      - "${PMAIL_MAIL_BIND:-0.0.0.0}:${PMAIL_HOST_POP3S_PORT:-995}:995"
      - "${PMAIL_MAIL_BIND:-0.0.0.0}:${PMAIL_HOST_IMAP_PORT:-143}:143"
      - "${PMAIL_MAIL_BIND:-0.0.0.0}:${PMAIL_HOST_IMAPS_PORT:-993}:993"
      # 默认供 NPM 访问；直连公网使用 docker-compose.public.yml 覆盖端口。
      - "${PMAIL_WEB_BIND:-172.17.0.1}:${PMAIL_HOST_HTTP_PORT:-8080}:${PMAIL_HTTP_PORT:-80}"
      - "${PMAIL_WEB_BIND:-172.17.0.1}:${PMAIL_HOST_HTTPS_PORT:-8443}:${PMAIL_HTTPS_PORT:-443}"
  updater:
    profiles: ["updater"]
    build:
      context: .
      dockerfile: Dockerfile.updater
    image: pmail-updater:local
    restart: unless-stopped
    environment:
      PMAIL_UPDATER_TOKEN:
      PMAIL_UPDATER_PROJECT: ${COMPOSE_PROJECT_NAME:-${PMAIL_PROJECT_NAME:-pmail}}
    networks: [update-private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/project:ro
      - updater_state:/state
networks:
  update-private:
    internal: true

volumes:
  pg_data:
  pmail_config:
  secrets:
  updater_state:

# 下载本文件后执行 docker compose up -d；.env 可选（Compose 2.24+）。
name: ${PMAIL_PROJECT_NAME:-pmail}
x-pmail-image: &pmail-image ${PMAIL_IMAGE:-dingding229/pmail-pro:latest}

services:
  pmail:
    image: *pmail-image
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    # 旧 .env 可能含有初始化密码；不把它交给应用进程。
    environment:
      POSTGRES_PASSWORD: ""
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "110:110"
      - "995:995"
      - "143:143"
      - "993:993"
      # 仅供本机反代；对公网直连请使用 docker-compose.public.yml。
      - "172.17.0.1:8080:80"
    volumes:
      - pmail_config:/work/config
      - secrets:/run/pmail-secrets:ro

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: pmail
      POSTGRES_USER: pmail
      POSTGRES_PASSWORD_FILE: /run/pmail-secrets/db_password
    volumes:
      - pg_data:/var/lib/postgresql/data
      - secrets:/run/pmail-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pmail -d pmail"]
      interval: 5s
      timeout: 5s
      retries: 12

  init-secrets:
    image: *pmail-image
    command: ["/work/pmail", "init-secrets", "/run/pmail-secrets/db_password"]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - secrets:/run/pmail-secrets

volumes:
  pg_data:
  pmail_config:
  secrets:

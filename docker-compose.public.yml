# 可选：不用反向代理，由 PMail 直接提供公网 80/443 网页。
# 用法：把本文件另存为 docker-compose.override.yml，与 docker-compose.yml 放在同一目录，再执行 docker compose up -d。
# 需要 Docker Compose 2.24.4 或更新版本。
services:
  pmail:
    environment:
      PMAIL_WEB_MODE: public
    ports: !override
      - "25:25"
      - "465:465"
      - "587:587"
      - "110:110"
      - "995:995"
      - "143:143"
      - "993:993"
      - "80:80"
      - "443:443"
  updater:
    environment:
      PMAIL_UPDATER_PUBLIC: "1"
